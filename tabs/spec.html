<!-- 사양표 -->
<style>
  #spec-bom-modal, #spec-bom-modal *,
  .tab-toolbar, .tab-toolbar *,
  #spec-tab-orders, #spec-tab-catalog, #spec-tab-reverse,
  #spec-date-header, #spec-date-header *,
  #spec-table-panel, #spec-table-panel *,
  #spec-reverse-panel, #spec-reverse-panel * {
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif !important;
  }
</style>
<div class="tab-toolbar">
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:23px;font-weight:900;color:#1e3264;letter-spacing:2px">사양표&자재출고요청</span>
    <div style="width:1px;height:16px;background:var(--border)"></div>
    <span id="spec-rev-badge" style="font-size:13px;font-weight:700;color:#111827">Rev. 0</span>
    <span id="spec-rev-date" style="font-size:13px;color:#374151">개정일: -</span>
    <button class="btn btn-ghost btn-sm" onclick="openRevModal('spec')">이력</button>
  </div>
  <div style="flex:1"></div>
  <button class="btn btn-primary btn-sm edit-only" id="spec-save-btn" onclick="saveDocument('spec')">&#x1F4BE; 저장</button>
  <button class="btn btn-ghost btn-sm" id="spec-edit-btn" onclick="specToggleEdit(this)">&#x270F; 편집 모드</button>
</div>

<div style="display:flex;flex-direction:column;height:calc(100vh - 100px);overflow:hidden">

  <!-- 내부 탭 -->
  <div style="display:flex;background:#f0f4fa;border-bottom:2px solid #c9d4e8;flex-shrink:0">
    <button id="spec-tab-orders"  onclick="specSwitchTab('orders')"  style="padding:8px 18px;font-size:20px;font-weight:600;border:none;background:#1e3264;color:#fff;cursor:pointer;border-right:1px solid #c9d4e8">작업지시</button>
    <button id="spec-tab-catalog" onclick="specSwitchTab('catalog')" style="padding:8px 18px;font-size:20px;font-weight:600;border:none;background:transparent;color:#374151;cursor:pointer;border-right:1px solid #c9d4e8">전체 리스트</button>
    <button id="spec-tab-reverse" onclick="specSwitchTab('reverse')" style="padding:8px 18px;font-size:20px;font-weight:600;border:none;background:transparent;color:#374151;cursor:pointer;border-right:1px solid #c9d4e8">자재 역추적</button>
    <button id="spec-tab-shipstatus" onclick="specSwitchTab('shipstatus')" style="padding:8px 18px;font-size:20px;font-weight:600;border:none;background:transparent;color:#374151;cursor:pointer">출고요청현황</button>
  </div>

  <!-- 날짜 선택 (파란 헤더 — 작업지시 탭만 표시) -->
  <div id="spec-date-header" style="background:#1e3264;flex-shrink:0">
    <div style="padding:10px 16px;display:flex;align-items:center;gap:10px">
      <button class="btn btn-ghost btn-sm" onclick="prevMonth('spec');specRenderDayPicker()"
        style="color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08)">&#x2039;</button>
      <span id="spec-month-label" style="font-weight:700;font-size:22px;min-width:90px;text-align:center;color:#fff"></span>
      <button class="btn btn-ghost btn-sm" onclick="nextMonth('spec');specRenderDayPicker()"
        style="color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08)">&#x203A;</button>
      <span style="color:rgba(255,255,255,.35);margin:0 4px">|</span>
      <span id="spec-sel-date" style="font-size:21px;font-weight:700;color:#fff;background:rgba(255,255,255,.15);padding:3px 12px;border-radius:6px;letter-spacing:.5px">날짜 선택</span>
      <div style="flex:1"></div>
      <span id="spec-car-badge" style="font-size:19px;color:rgba(255,255,255,.65);padding:2px 8px;border:1px solid rgba(255,255,255,.25);border-radius:4px"></span>
    </div>
    <div style="padding:10px 16px;border-top:1px solid rgba(255,255,255,.1)">
      <div id="spec-day-picker" style="display:flex;flex-wrap:wrap;gap:4px"></div>
    </div>
  </div>

  <!-- 메인 바디 -->
  <div style="display:flex;flex:1;min-height:0">

    <!-- 작업지시 / 전체 리스트 패널 -->
    <div id="spec-table-panel" style="flex:1;min-width:0;display:flex;flex-direction:column;background:#fff">
      <div style="padding:6px 10px;border-bottom:1px solid #e5e7eb;background:#f8fafc;flex-shrink:0;display:flex;align-items:center;gap:6px">
        <input id="spec-search" type="text" placeholder="도번 / 옵션명 검색..." oninput="specFilterTable()"
          style="flex:1;padding:5px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:20px;outline:none">
        <button id="spec-bulk-ship-btn" onclick="specBulkShipRequest()" style="display:none;padding:6px 14px;background:#16a34a;color:#fff;border:none;border-radius:6px;font-size:18px;font-weight:700;cursor:pointer;white-space:nowrap">✅ 선택 출고요청 <span id="spec-ship-sel-count"></span></button>
        <span id="spec-count-badge" style="font-size:19px;color:#6b7280;white-space:nowrap"></span>
      </div>
      <div id="spec-table-wrap" style="flex:1;overflow-y:auto">
        <div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">로딩 중...</div>
      </div>
    </div>

    <!-- 자재 역추적 패널 -->
    <div id="spec-reverse-panel" style="display:none;flex:1;min-width:0;flex-direction:column;background:#fff">
      <div style="padding:8px 12px;border-bottom:1px solid #e5e7eb;background:#f8fafc;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="flex:1;position:relative">
            <input id="spec-reverse-search" type="text" placeholder="자재 품번 일부 입력 후 선택..."
              autocomplete="off"
              oninput="specReverseSuggest()"
              onkeydown="if(event.key==='Enter'){specHideSuggest();specReverseSearch();}if(event.key==='Escape')specHideSuggest();if(event.key==='ArrowDown'){event.preventDefault();specSuggestFocus(1);}if(event.key==='ArrowUp'){event.preventDefault();specSuggestFocus(-1);}"
              style="width:100%;box-sizing:border-box;padding:5px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:20px;outline:none">
            <div id="spec-reverse-suggest"
              style="display:none;position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:200;
                     background:#fff;border:1px solid #c9d4e8;border-radius:6px;
                     box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:300px;overflow-y:auto"></div>
          </div>
          <button onclick="specHideSuggest();specReverseSearch()" style="padding:5px 12px;background:#1e3264;color:#fff;border:none;border-radius:6px;font-size:20px;cursor:pointer;white-space:nowrap">조회</button>
          <span id="spec-reverse-badge" style="font-size:19px;color:#6b7280;white-space:nowrap"></span>
        </div>
        <div id="spec-reverse-partname" style="display:none;margin-top:5px;font-size:20px;color:#1e3264;font-weight:600;padding:0 2px"></div>
      </div>
      <div id="spec-reverse-wrap" style="flex:1;overflow-y:auto">
        <div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">자재 품번을 입력하면 해당 부품이 사용되는 완제품 목록을 보여줍니다</div>
      </div>
    </div>

    <!-- 출고요청현황 패널 -->
    <div id="spec-shipstatus-panel" style="display:none;flex:1;min-width:0;flex-direction:column;background:#fff">
      <div style="padding:8px 12px;border-bottom:1px solid #e5e7eb;background:#f8fafc;flex-shrink:0;display:flex;align-items:center;gap:10px">
        <div id="spec-ship-subtabs" style="display:flex;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden">
          <button id="spec-shiptab-product" onclick="specSetShipTab('product')" style="padding:5px 14px;font-size:17px;font-weight:700;border:none;cursor:pointer;background:#1e3264;color:#fff">완제품 기준</button>
          <button id="spec-shiptab-part" onclick="specSetShipTab('part')" style="padding:5px 14px;font-size:17px;font-weight:500;border:none;cursor:pointer;background:#fff;color:#64748b">부품 기준</button>
        </div>
        <div style="flex:1"></div>
        <span id="spec-ship-status-count" style="font-size:18px;color:#6b7280"></span>
        <button onclick="specLoadShipStatus()" style="padding:5px 14px;background:#1e3264;color:#fff;border:none;border-radius:6px;font-size:18px;cursor:pointer;white-space:nowrap">새로고침</button>
      </div>
      <div id="spec-shipstatus-wrap" style="flex:1;overflow:auto;background:#f8fafc">
        <div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">상단에서 날짜를 선택하면 해당 라인의 출고요청 현황을 보여줍니다</div>
      </div>
    </div>

  </div>
</div>

<!-- 부품 사진 모달 -->
<div id="spec-bom-modal" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;width:90vw;max-width:1100px;height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <!-- 모달 헤더 -->
    <div style="background:#1e3264;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div style="flex:1">
        <div id="spec-modal-title" style="font-size:22px;font-weight:700;font-family:monospace"></div>
        <div id="spec-modal-sub" style="font-size:19px;color:rgba(255,255,255,.6);margin-top:2px"></div>
      </div>
      <button id="spec-modal-edit-btn" onclick="specModalToggleEdit(this)"
        style="padding:5px 12px;border:1px solid rgba(255,255,255,.4);border-radius:6px;background:transparent;color:#fff;font-size:19px;cursor:pointer">✏ 편집</button>
      <button id="spec-modal-save-btn" onclick="specSaveBomChanges()"
        style="display:none;padding:5px 14px;border:none;border-radius:6px;background:#22c55e;color:#fff;font-size:19px;font-weight:600;cursor:pointer">저장</button>
      <button onclick="specCloseModal()"
        style="background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:18px;padding:2px 6px;line-height:1">✕</button>
    </div>
    <!-- 모달 바디 -->
    <div id="spec-modal-body" style="flex:1;overflow-y:auto;padding:16px;background:#f8fafc">
      <div style="text-align:center;color:#9ca3af;padding:40px">로드 중...</div>
    </div>
  </div>
</div>

<!-- 부품 출고요청 수량 입력 모달 -->
<div id="spec-ship-modal" style="display:none;position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.55);align-items:center;justify-content:center;font-family:'Malgun Gothic','맑은 고딕',sans-serif">
  <div style="background:#fff;border-radius:12px;width:92vw;max-width:440px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)">
    <div style="background:#16a34a;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div style="font-size:20px;font-weight:700">📦 부품 출고요청</div>
        <div id="spec-ship-modal-sub" style="font-size:15px;color:rgba(255,255,255,.85);margin-top:2px"></div>
      </div>
      <button onclick="specShipModalClose()" style="background:none;border:none;color:rgba(255,255,255,.85);font-size:20px;cursor:pointer;line-height:1">✕</button>
    </div>
    <div style="padding:18px">
      <div id="spec-ship-modal-part" style="font-family:monospace;font-size:19px;color:#1e3264;font-weight:700;margin-bottom:3px"></div>
      <div id="spec-ship-modal-name" style="font-size:16px;color:#6b7280;margin-bottom:14px;line-height:1.3"></div>
      <label style="font-size:16px;color:#374151;display:block;margin-bottom:6px;font-weight:600">출고 수량</label>
      <input id="spec-ship-modal-qty" type="number" min="1" onkeydown="if(event.key==='Enter')specShipPartConfirm()"
        style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:22px;text-align:right;outline:none">
      <div id="spec-ship-modal-hint" style="font-size:14px;color:#9ca3af;margin-top:6px"></div>
    </div>
    <div style="padding:0 18px 18px;display:flex;gap:8px">
      <button onclick="specShipModalClose()" style="flex:1;padding:11px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:8px;font-size:17px;cursor:pointer">취소</button>
      <button onclick="specShipPartConfirm()" style="flex:2;padding:11px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:700;cursor:pointer">출고요청</button>
    </div>
  </div>
</div>

<!-- 공용 확인 모달 (브라우저 confirm 대체) -->
<div id="spec-confirm-modal" style="display:none;position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.55);align-items:center;justify-content:center;font-family:'Malgun Gothic','맑은 고딕',sans-serif">
  <div style="background:#fff;border-radius:12px;width:92vw;max-width:460px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)">
    <div style="background:#1e3264;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px">
      <div id="spec-confirm-title" style="flex:1;font-size:20px;font-weight:700">확인</div>
      <button onclick="specConfirmClose(false)" style="background:none;border:none;color:rgba(255,255,255,.85);font-size:20px;cursor:pointer;line-height:1">✕</button>
    </div>
    <div id="spec-confirm-body" style="padding:18px;font-size:17px;color:#374151;line-height:1.5;max-height:55vh;overflow-y:auto"></div>
    <div style="padding:0 18px 18px;display:flex;gap:8px">
      <button onclick="specConfirmClose(false)" style="flex:1;padding:11px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:8px;font-size:17px;cursor:pointer">취소</button>
      <button id="spec-confirm-ok" onclick="specConfirmClose(true)" style="flex:2;padding:11px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:700;cursor:pointer">확인</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

let _specDay = null;
let _specEditMode = false;
let _specCatalog = [];       // full product list from spec_bom
let _specMesMap = {};        // part_no → {qt_order, no_mmmo, nm_item, cd_item}
let _specSearchQ = '';
let _specSelectedPartNo = null;
let _specPhotosData = [];
let _specBomData = [];
let _specUploading = false;
let _specLinePartNos = null; // Set of part_nos on selected line
let _specTab = 'orders';    // 'orders' | 'catalog' | 'reverse'
let _specMesLoaded = false;
let _specItemNames = {};    // part_no → nm_item (MSSQL item master, date-independent)
let _specDriveIndex = {};  // sub_part_no → Google Drive fileId (from Drive folder listing)
let _specBomDeleted = new Set(); // sub_part_no pending deletion

// keep backward-compat alias
let _specMasterItems = [];
let _specSelectedCdItem = null;

// ── 출고요청 상태 ──
let _specOrderRowMeta = {};  // shipKey(색상포함도번) → {cd_item,color_code,product_name,work_order_no,qt_order,bom_count}
let _specModalBomPartNo = null;  // 현재 모달의 완제품 색상포함 도번
function _specAutoTimeSlot(){
  const h = new Date().getHours();
  if (h < 11) return 'A';        // ~10시대
  if (h < 13) return 'B';        // 11~12시대
  if (h < 16) return 'C';        // 13~15시대
  return 'D';                    // 16시 이후
}
function _specTsOptions(sel){
  const map = {A:'A(09-11)',B:'B(11-13)',C:'C(14-16)',D:'D(16-18)'};
  return Object.keys(map).map(k=>`<option value="${k}"${k===sel?' selected':''}>${map[k]}</option>`).join('');
}
// 출고시간대 A/B/C/D 색상(시간 흐름: 파랑→초록→노랑→빨강) — 작업자 시각 구분용
const _SHIP_TS_COLOR = {A:'#2563eb', B:'#7c3aed', C:'#f59e0b', D:'#dc2626'};
function _tsBarColor(v){ return _SHIP_TS_COLOR[v] || '#cbd5e1'; }
// 선택값에 맞춰 좌측 컬러 바 + 옅은 배경 적용
window._specTsColor = function(sel){
  const c = _tsBarColor(sel.value);
  sel.style.borderLeft = '8px solid ' + c;
  sel.style.background = c + '1a'; // 약 10% 투명도 틴트
  sel.style.fontWeight = '700';
};
window.specUpdateShipSelCount = function(){
  const n = document.querySelectorAll('#spec-table-wrap .ship-chk:checked').length;
  const el = document.getElementById('spec-ship-sel-count');
  if (el) el.textContent = n>0?`(${n})`:'';
};
window.specToggleAllShip = function(master){
  document.querySelectorAll('#spec-table-wrap .ship-chk').forEach(c=>{ c.checked = master.checked; });
  specUpdateShipSelCount();
};
// ── 중복 출고요청 방지: 선택 날짜에 이미 요청된 완제품 도번 집합 (판정 = cd_item + 출고일자) ──
let _specReqedCd = new Set();      // 이미 출고요청된 cd_item 집합
let _specReqedKey = null;          // 캐시 키(라인|날짜)
let _specReqedLoading = false;
function _specReqKeyInfo(){
  const lineName = _getCarLineName();
  const m = getTabMonth('spec');
  const dateStr = _specDay ? _fmtDate(m.year, m.month, _specDay) : '';
  return { lineName, dateStr, key:(lineName||'')+'|'+dateStr };
}
// 선택 날짜의 기존 출고요청을 불러와 _specReqedCd 갱신(지연 로드). force=true면 강제 재조회.
function _specEnsureReqedCd(force){
  const { lineName, dateStr, key } = _specReqKeyInfo();
  if(!force && key===_specReqedKey) return;
  if(_specReqedLoading) return;
  _specReqedKey = key;
  if(!dateStr){ _specReqedCd = new Set(); return; }
  _specReqedLoading = true;
  AIT_API.getShipRequests(lineName, dateStr)
    .then(res=>{ const rows=Array.isArray(res)?res:[]; _specReqedCd=new Set(rows.map(r=>String(r.cd_item))); })
    .catch(()=>{ _specReqedCd=new Set(); })   // 조회 실패 시 빈 집합 → 경고/배지 없음(차단하지 않음)
    .finally(()=>{ _specReqedLoading=false; if(_specTab==='orders') specRenderTable(); });
}
// 이미 출고요청된 완제품에 표시할 이력 배지
function _specReqedBadge(cd){
  return _specReqedCd.has(String(cd))
    ? `<span style="display:inline-block;background:#16a34a;color:#fff;padding:2px 9px;border-radius:10px;font-size:14px;font-weight:800;margin-left:6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)">✅ 출고요청함</span>`
    : '';
}
// 앱 스타일 확인 모달(브라우저 confirm 대체) → Promise<boolean>
let _specConfirmResolve = null;
function specConfirm({title='확인', html='', confirmText='확인', confirmColor='#16a34a'}={}){
  const modal=document.getElementById('spec-confirm-modal');
  if(!modal) return Promise.resolve(window.confirm(String(html).replace(/<[^>]+>/g,'')));
  document.getElementById('spec-confirm-title').textContent=title;
  document.getElementById('spec-confirm-body').innerHTML=html;
  const ok=document.getElementById('spec-confirm-ok');
  ok.textContent=confirmText; ok.style.background=confirmColor;
  modal.style.display='flex';
  return new Promise(res=>{ _specConfirmResolve=res; });
}
window.specConfirmClose = function(ok){
  const modal=document.getElementById('spec-confirm-modal');
  if(modal) modal.style.display='none';
  if(_specConfirmResolve){ _specConfirmResolve(!!ok); _specConfirmResolve=null; }
};
window.specBulkShipRequest = async function(){
  const checked = [...document.querySelectorAll('#spec-table-wrap .ship-chk:checked')];
  if (!checked.length){ showToast('출고요청할 항목을 선택하세요','info'); return; }
  const lineName = _getCarLineName();
  if (!lineName){ showToast('라인 정보가 없습니다','error'); return; }
  if (!_specDay){ showToast('날짜를 먼저 선택하세요','error'); return; }
  const m = getTabMonth('spec');
  const reqDate = _fmtDate(m.year, m.month, _specDay);
  const items=[]; const skipped=[];
  for (const chk of checked){
    const key = chk.dataset.pn;
    const meta = _specOrderRowMeta[key]; if (!meta) continue;
    const row = chk.closest('tr');
    const qty = parseInt(row.querySelector('.ship-qty')?.value)||0;
    const prio = parseInt(row.querySelector('.ship-prio')?.value)||0;
    const ts = row.querySelector('.ship-ts')?.value||null;
    if (qty<=0){ skipped.push(key+'(수량0)'); continue; }
    items.push({ cd_item:meta.cd_item, color_code:meta.color_code, work_order_no:meta.work_order_no, product_name:meta.product_name, req_qty:qty, time_slot:ts, priority:prio });
  }
  if (!items.length){ showToast('유효한 요청이 없습니다'+(skipped.length?' ('+skipped.join(', ')+')':''),'error'); return; }
  // 중복 출고요청 경고(분할출고 허용 → 차단하지 않고 확인만): 같은 날짜에 이미 요청된 완제품이 포함된 경우
  const dup = items.filter(it=>_specReqedCd.has(String(it.cd_item)));
  if (dup.length){
    const list = dup.map(d=>`<div style="font-family:monospace;color:#1e3264;margin:2px 0">• ${d.cd_item}</div>`).join('');
    const ok = await specConfirm({
      title:'⚠ 중복 출고요청 확인',
      html:`<div style="margin-bottom:10px">이미 출고요청한 완제품이 <b style="color:#dc2626">${dup.length}건</b> 포함되어 있습니다 <span style="color:#9ca3af">(분할출고)</span>.</div>
        <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px 10px;margin-bottom:10px">${list}</div>
        <div>그래도 추가로 출고요청하시겠습니까?</div>`,
      confirmText:'추가 출고요청', confirmColor:'#16a34a'
    });
    if (!ok) return;
  }
  showSaving();
  try{
    const r=await AIT_API.createShipRequest({ line_name:lineName, req_date:reqDate, items });
    const res=Array.isArray(r)?r[0]:(r||{});
    const created=Number(res.created!=null?res.created:items.length);
    const missed=Number(res.skipped!=null?res.skipped:0);   // BOM 미매칭으로 누락된 건수
    if(missed>0){
      showToast(`${items.length}건 중 ${created}건만 생성 — ${missed}건은 BOM 미매칭으로 누락`+(skipped.length?` (수량0 제외 ${skipped.length}건)`:''),'error');
    }else{
      showToast(`출고요청 ${created}건 전송 완료`+(skipped.length?` / 수량0 제외 ${skipped.length}건`:''),'success');
    }
    document.querySelectorAll('#spec-table-wrap .ship-chk:checked').forEach(c=>c.checked=false);
    const all=document.getElementById('spec-ship-chk-all'); if(all) all.checked=false;
    specUpdateShipSelCount();
    _specEnsureReqedCd(true);   // 방금 요청한 완제품에 '출고요청함' 배지 즉시 반영
  }catch(e){ showToast('출고요청 실패: '+e.message,'error'); }
  finally{ hideSaving(); }
};

// ── BOM 모달: 부품 단건 출고요청(수량 입력 모달) ──
let _specShipPending = null;
window.specRequestPart = function(idx){
  const row = _specBomData[idx];
  if(!row||!row.sub_part_no){ showToast('부품 정보 없음','error'); return; }
  const lineName = _getCarLineName();
  if(!lineName){ showToast('라인 정보가 없습니다','error'); return; }
  const mes = _specMesMap[_specSelectedPartNo]||{};
  const baseQty = parseFloat(row.qty)||1;
  const ord = parseInt(mes.qt_order)||0;
  const def = ord>0 ? baseQty*ord : baseQty;
  const m = getTabMonth('spec');
  const now = new Date();
  const reqDate = _specDay ? _fmtDate(m.year,m.month,_specDay) : _fmtDate(now.getFullYear(),now.getMonth()+1,now.getDate());
  const cdItem = _specModalBomPartNo || _specSelectedCdItem || '';
  const base = _specSelectedCdItem || '';
  const colorCode = (cdItem && base && cdItem!==base) ? cdItem.replace(base,'').substring(0,3) : '';
  const catalogItem = _specCatalog.find(c=>c.part_no===_specSelectedPartNo)||{};
  const productName = catalogItem.option_name || mes.nm_item || '';
  _specShipPending = { lineName, reqDate, cdItem, colorCode, workOrderNo:mes.no_mmmo||'', productName, subPartNo:row.sub_part_no, partName:row.part_name||'' };
  // 모달 채우기
  const subEl=document.getElementById('spec-ship-modal-sub');
  if(subEl) subEl.textContent=(lineName||'')+(cdItem?(' · '+cdItem):'');
  const partEl=document.getElementById('spec-ship-modal-part');
  if(partEl) partEl.textContent=row.sub_part_no;
  const nameEl=document.getElementById('spec-ship-modal-name');
  if(nameEl) nameEl.textContent=row.part_name||'';
  const qtyEl=document.getElementById('spec-ship-modal-qty');
  if(qtyEl) qtyEl.value=def;
  const hintEl=document.getElementById('spec-ship-modal-hint');
  if(hintEl) hintEl.textContent=ord>0?`기본값 = 작업지시수량 ${ord} × 소요량 ${baseQty}`:'소요량 기준';
  const modal=document.getElementById('spec-ship-modal');
  if(modal) modal.style.display='flex';
  if(qtyEl){ qtyEl.focus(); qtyEl.select(); }
};
window.specShipModalClose = function(){
  const modal=document.getElementById('spec-ship-modal');
  if(modal) modal.style.display='none';
  _specShipPending=null;
};
window.specShipPartConfirm = async function(){
  if(!_specShipPending) return;
  const p=_specShipPending;
  const qty=parseFloat(document.getElementById('spec-ship-modal-qty')?.value);
  if(!(qty>0)){ showToast('수량이 올바르지 않습니다','error'); return; }
  showSaving();
  try{
    await AIT_API.createShipRequestPart({ line_name:p.lineName, req_date:p.reqDate, cd_item:p.cdItem, color_code:p.colorCode, work_order_no:p.workOrderNo, product_name:p.productName, sub_part_no:p.subPartNo, part_name:p.partName, qty, time_slot:_specAutoTimeSlot(), priority:0 });
    showToast(`출고요청 완료: ${p.subPartNo} ${qty}개`,'success');
    specShipModalClose();
  }catch(e){ showToast('출고요청 실패: '+e.message,'error'); }
  finally{ hideSaving(); }
};

/* ── 출고요청현황 탭 ── */
function _specShipPhotoUrl(r){
  if(r.photo_url){ const u=AIT_API.normalizePhotoUrl(r.photo_url); if(u) return u; }
  if(r.photo_file_id) return AIT_API.driveUrl(r.photo_file_id);
  const idx=_specDriveIndex[String(r.sub_part_no)];
  if(idx) return AIT_API.driveUrl(idx);
  return '';
}
let _specShipRows=[]; let _specShipTab='product';
const _SHIP_TS_LABEL={A:'A(09-11)',B:'B(11-13)',C:'C(14-16)',D:'D(16-18)'};
const _SHIP_ST={requested:{t:'요청',bg:'#e5e7eb',c:'#374151'},confirmed:{t:'확인',bg:'#dbeafe',c:'#1e40af'},done:{t:'완료',bg:'#dcfce7',c:'#166534'}};
function _specShipHeaderStatus(items){
  if(items.every(i=>i.status==='done')) return {t:'완료',bg:'#dcfce7',c:'#166534'};
  if(items.some(i=>i.status==='confirmed'||i.status==='done')) return {t:'진행중',bg:'#fef3c7',c:'#92400e'};
  return {t:'요청',bg:'#e5e7eb',c:'#374151'};
}
window.specLoadShipStatus = async function(){
  const wrap=document.getElementById('spec-shipstatus-wrap'); if(!wrap) return;
  const lineName=_getCarLineName();
  const m=getTabMonth('spec');
  const dateStr=_specDay?_fmtDate(m.year,m.month,_specDay):'';
  const lineEl=document.getElementById('spec-ship-status-line');
  if(lineEl) lineEl.textContent=(lineName||'(라인 없음)')+(dateStr?` · ${m.year}.${String(m.month).padStart(2,'0')}.${String(_specDay).padStart(2,'0')}`:'');
  if(!dateStr){ wrap.innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">상단에서 날짜를 선택하세요</div>'; return; }
  wrap.innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">조회 중...</div>';
  try{
    const res=await AIT_API.getShipRequests(lineName,dateStr);
    _specShipRows=Array.isArray(res)?res:[];
    _specRenderShipActive();
  }catch(e){ wrap.innerHTML=`<div style="padding:30px;text-align:center;color:#ef4444;font-size:20px">오류: ${e.message}</div>`; }
};
function _specRenderShipActive(){
  if(_specShipTab==='part') _specRenderShipPart(_specShipRows); else _specRenderShipStatus(_specShipRows);
}
function _specStyleShipTabs(){
  const p=document.getElementById('spec-shiptab-product'), q=document.getElementById('spec-shiptab-part');
  if(!p||!q) return;
  [['product',p],['part',q]].forEach(([t,el])=>{
    const on=_specShipTab===t;
    el.style.background=on?'#1e3264':'#fff';
    el.style.color=on?'#fff':'#64748b';
    el.style.fontWeight=on?'700':'500';
  });
}
window.specSetShipTab = function(t){
  _specShipTab=t;
  _specStyleShipTabs();
  _specRenderShipActive();
};
function _specRenderShipStatus(rows){
  const wrap=document.getElementById('spec-shipstatus-wrap'); if(!wrap) return;
  const cntEl=document.getElementById('spec-ship-status-count');
  const groups={}, order=[];
  rows.forEach(r=>{ if(!groups[r.request_id]){groups[r.request_id]=[];order.push(r.request_id);} groups[r.request_id].push(r); });
  if(cntEl) cntEl.textContent=order.length?`요청 ${order.length}건`:'';
  if(!order.length){ wrap.innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">해당 라인/날짜의 출고요청이 없습니다</div>'; return; }
  let html='';
  order.forEach(rid=>{
    const items=groups[rid]; const h=items[0];
    const hs=_specShipHeaderStatus(items);
    const allReq=items.every(i=>i.status==='requested');
    const prio=Number(h.priority)>0?`<span style="background:#fee2e2;color:#b91c1c;padding:1px 8px;border-radius:4px;font-weight:700;font-size:16px">${h.priority}순위</span>`:'';
    const ts=h.time_slot?`<span style="background:#e0e7ff;color:#3730a3;padding:1px 8px;border-radius:4px;font-size:16px">${_SHIP_TS_LABEL[h.time_slot]||h.time_slot}</span>`:'';
    const src=h.source==='modal'?`<span style="background:#f3e8ff;color:#7c2d12;padding:1px 6px;border-radius:4px;font-size:14px">부품단건</span>`:'';
    const cancelBtn=allReq?`<button onclick="specCancelShipRequest(${rid})" style="padding:4px 12px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;border-radius:5px;font-size:16px;cursor:pointer;font-weight:700">취소</button>`:'';
    const itemCards=items.map(it=>{
      const url=_specShipPhotoUrl(it);
      const thumb=url?`<img src="${url}" style="width:100%;height:96px;object-fit:contain;background:#f8fafc" onerror="this.style.display='none'">`:`<div style="height:96px;display:flex;align-items:center;justify-content:center;color:#d1d5db;font-size:30px;background:#f3f4f6">▣</div>`;
      const sb=_SHIP_ST[it.status]||_SHIP_ST.requested;
      const seg=['requested','confirmed','done'].map(s=>{
        const on=it.status===s; const lab=_SHIP_ST[s].t;
        return `<button onclick="specShipItemStatus(${it.item_id},'${s}')" style="flex:1;padding:4px 0;border:1px solid #cbd5e1;background:${on?_SHIP_ST[s].bg:'#fff'};color:${on?_SHIP_ST[s].c:'#94a3b8'};font-weight:${on?'800':'500'};font-size:15px;cursor:pointer">${lab}</button>`;
      }).join('');
      const qtyTxt=(Math.round((Number(it.total_qty)||0)*1000)/1000).toLocaleString('en-US',{maximumFractionDigits:3});
      return `<div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden">
        <div style="position:relative">${thumb}<span style="position:absolute;top:4px;right:4px;background:${sb.bg};color:${sb.c};padding:1px 7px;border-radius:4px;font-size:14px;font-weight:700">${sb.t}</span></div>
        <div style="padding:6px 8px">
          <div style="font-family:monospace;font-size:17px;color:#1e3264;font-weight:700">${it.sub_part_no}</div>
          <div style="font-size:15px;color:#6b7280;line-height:1.25;height:38px;overflow:hidden">${it.part_name||''}</div>
          <div style="font-size:16px;color:#111827;margin:3px 0">출고수량: <strong>${qtyTxt}</strong></div>
          <div style="display:flex;gap:2px;margin-top:4px">${seg}</div>
        </div>
      </div>`;
    }).join('');
    html+=`<div style="border:1px solid #d1d9e6;border-radius:10px;margin:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)">
      <div style="background:#1e3264;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${prio}${ts}
        <span style="font-family:monospace;font-size:19px;font-weight:700">${h.cd_item}</span>
        <span style="font-size:16px;color:rgba(255,255,255,.8)">${h.product_name||''}</span>
        ${h.work_order_no?`<span style="font-size:15px;color:rgba(255,255,255,.6);font-family:monospace">${h.work_order_no}</span>`:''}
        ${src}
        <div style="flex:1"></div>
        <span style="background:${hs.bg};color:${hs.c};padding:2px 10px;border-radius:5px;font-size:16px;font-weight:700">${hs.t}</span>
        ${cancelBtn}
      </div>
      <div style="padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;background:#f8fafc">${itemCards}</div>
    </div>`;
  });
  wrap.innerHTML=html;
}
function _specRenderShipPart(rows){
  const wrap=document.getElementById('spec-shipstatus-wrap'); if(!wrap) return;
  const cntEl=document.getElementById('spec-ship-status-count');
  const ORDER=['A','B','C','D'];
  const slotSet=new Set();
  rows.forEach(r=>slotSet.add((r.time_slot||'').toUpperCase()||'기타'));
  // A/B/C/D 4개 컬럼은 항상 표시 + 그 외 슬롯(기타 등)이 있으면 뒤에 추가
  const slots=ORDER.concat([...slotSet].filter(s=>!ORDER.includes(s)).sort());
  const parts={}, porder=[];
  rows.forEach(r=>{
    const k=r.sub_part_no;
    if(!parts[k]){ parts[k]={pn:k,nm:r.part_name||'',line:r.line_name||'',slots:{},total:0}; porder.push(k); }
    const sl=(r.time_slot||'').toUpperCase()||'기타';
    if(!parts[k].slots[sl]) parts[k].slots[sl]={qty:0,items:[],ts:''};
    const q=Number(r.total_qty)||0;
    parts[k].slots[sl].qty+=q;
    parts[k].slots[sl].items.push({id:r.item_id,status:r.status,rid:r.request_id});
    if(r.created_at && r.created_at>parts[k].slots[sl].ts) parts[k].slots[sl].ts=r.created_at;
    parts[k].total+=q;
  });
  if(cntEl) cntEl.textContent=porder.length?`부품 ${porder.length}종`:'';
  if(!porder.length){ wrap.innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">해당 라인/날짜의 출고요청이 없습니다</div>'; return; }
  porder.sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'}));
  const fmtQty=n=>{ n=Math.round(Number(n)*1000)/1000; return n.toLocaleString('en-US',{maximumFractionDigits:3}); };
  const SC={A:{h:'#0284c7',t:'#eff6ff',c:'#075985'},B:{h:'#16a34a',t:'#f0fdf4',c:'#166534'},C:{h:'#d97706',t:'#fffbeb',c:'#b45309'},D:{h:'#7c3aed',t:'#f5f3ff',c:'#6d28d9'},'기타':{h:'#64748b',t:'#f8fafc',c:'#475569'}};
  const sc=s=>SC[s]||SC['기타'];
  const navy='position:sticky;top:0;background:#1e3264;color:#fff;border:1px solid #e5e7eb;padding:8px';
  let html='<table style="width:100%;border-collapse:separate;border-spacing:0;background:#fff;font-size:17px">'
    +'<thead><tr>'
    +`<th style="${navy};left:0;z-index:3;width:44px;min-width:44px;text-align:center">NO.</th>`
    +`<th style="${navy};left:44px;z-index:3;text-align:left">부품</th>`
    +`<th style="${navy};z-index:2;text-align:center;min-width:80px">라인명</th>`
    + slots.map(s=>{const col=sc(s);return `<th style="position:sticky;top:0;z-index:2;color:#fff;border:1px solid #e5e7eb;padding:8px;text-align:center;min-width:96px;background:${col.h}">${_SHIP_TS_LABEL[s]||s}</th>`;}).join('')
    + `<th style="${navy};z-index:2;text-align:center;min-width:80px">합계</th>`
    +'</tr></thead><tbody>';
  porder.forEach((k,idx)=>{
    const p=parts[k];
    html+=`<tr><td style="position:sticky;left:0;z-index:1;background:#fff;border:1px solid #e5e7eb;padding:6px;text-align:center;font-weight:800;color:#64748b;font-size:15px;vertical-align:middle">${idx+1}</td>`
      +`<td style="position:sticky;left:44px;z-index:1;background:#fff;border:1px solid #e5e7eb;padding:6px 8px;text-align:left;white-space:nowrap;box-shadow:3px 0 5px rgba(15,23,42,.07)"><span style="font-family:monospace;font-size:18px;font-weight:700;color:#1e3264">${p.pn}</span><div style="font-size:13px;color:#6b7280;max-width:240px;white-space:normal;line-height:1.25">${p.nm}</div></td>`
      +`<td style="border:1px solid #e5e7eb;padding:6px 8px;text-align:center;font-weight:700;color:#1e3264;white-space:nowrap">${p.line||''}</td>`;
    slots.forEach(s=>{
      const col=sc(s), c=p.slots[s];
      if(!c||!c.qty){ html+=`<td style="border:1px solid #e5e7eb;background:${col.t}"></td>`; return; }
      const ids=c.items.map(i=>i.id).join(',');
      const rids=c.items.map(i=>i.rid).join(',');
      const allReq=c.items.every(i=>i.status==='requested');
      const allConf=c.items.every(i=>i.status==='confirmed'||i.status==='done');
      const allDone=c.items.every(i=>i.status==='done');
      const confT=allConf?'requested':'confirmed';
      const doneT=allDone?'confirmed':'done';
      const bg=allDone?'#dcfce7':col.t;
      const qc=allDone?'#166534':(allConf?'#1d4ed8':col.c);
      html+=`<td style="border:1px solid #e5e7eb;padding:5px 6px;text-align:center;background:${bg};vertical-align:top">
        <div style="font-size:21px;font-weight:800;color:${qc}">${fmtQty(c.qty)}</div>
        ${c.ts?`<div style="font-size:11px;color:#64748b;font-weight:600;margin-top:3px;white-space:nowrap">🕒 ${(''+c.ts).replace('T',' ').slice(5,16)}</div>`:''}
        <div style="display:flex;gap:2px;margin-top:4px;justify-content:center">
          <button onclick="specShipBulkStatus('${ids}','${confT}')" style="padding:3px 8px;border:1px solid #cbd5e1;border-radius:4px;font-size:13px;cursor:pointer;background:${allConf?'#dbeafe':'#fff'};color:${allConf?'#1e40af':'#94a3b8'};font-weight:${allConf?'800':'600'}">확인${allConf?' ✓':''}</button>
          <button onclick="specShipBulkStatus('${ids}','${doneT}')" style="padding:3px 8px;border:1px solid #cbd5e1;border-radius:4px;font-size:13px;cursor:pointer;background:${allDone?'#dcfce7':'#fff'};color:${allDone?'#166534':'#94a3b8'};font-weight:${allDone?'800':'600'}">완료${allDone?' ✓':''}</button>
        </div>
        ${allReq?`<div style="margin-top:3px"><button onclick="specShipCancelCell('${ids}','${rids}')" style="padding:2px 12px;border:1px solid #fca5a5;border-radius:4px;font-size:12px;cursor:pointer;background:#fee2e2;color:#dc2626;font-weight:700">취소</button></div>`:''}
      </td>`;
    });
    html+=`<td style="border:1px solid #e5e7eb;padding:6px 8px;text-align:center;background:#eef4ff;font-weight:800;font-size:21px;color:#1e3264">${fmtQty(p.total)}</td></tr>`;
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
}
window.specShipBulkStatus = async function(ids,status){
  showSaving();
  try{
    const list=String(ids).split(',').filter(Boolean);
    for(const id of list){ await AIT_API.updateShipRequestItem(Number(id),status); }
    await specLoadShipStatus();
  }catch(e){ showToast('상태변경 실패: '+e.message,'error'); }
  finally{ hideSaving(); }
};
window.specShipCancelCell = async function(idsStr,ridsStr){
  if(!confirm('이 부품 출고요청을 취소(삭제)하시겠습니까?\n확인/완료가 시작된 항목은 취소되지 않습니다.')) return;
  const ids=String(idsStr).split(',').filter(Boolean);
  const rids=String(ridsStr).split(',');
  showSaving();
  try{
    for(let i=0;i<ids.length;i++){ await AIT_API.deleteShipRequestItem(Number(ids[i]), Number(rids[i])||0); }
    showToast('출고요청 취소 완료','success');
    await specLoadShipStatus();
    _specEnsureReqedCd(true);   // 삭제 반영 → '출고요청함' 배지 갱신
  }catch(e){ showToast('취소 실패: '+e.message,'error'); }
  finally{ hideSaving(); }
};

/* ── 한국 공휴일 ── */
const KR_FIXED = ['1-1','3-1','5-5','6-6','8-15','10-3','10-9','12-25'];
const KR_EXTRA = {
  2025:['1-27','1-28','1-29','3-3','10-5','10-6','10-7','10-8'],
  2026:['2-16','2-17','2-18','3-2','6-3','8-17','9-25','9-26','9-27','9-28','9-29','10-5']
};
const KR_NO_SUB = { 2026:['6-8'] }; // 자동계산 대체공휴일 제외 (지방선거로 인해 미지정)
const _subCache = {};
function _calcSubs(year){
  const s=new Set();
  [[1,1],[3,1],[5,5],[6,6],[8,15],[10,3],[10,9],[12,25]].forEach(([mo,da])=>{
    const dow=new Date(year,mo-1,da).getDay();
    let off=0; if(dow===0)off=1; else if(dow===6)off=2;
    if(off){const d=new Date(year,mo-1,da+off);s.add(`${d.getMonth()+1}-${d.getDate()}`);}
  });
  return s;
}
function _isHol(year,month,d){
  if(new Date(year,month-1,d).getDay()===0) return true;
  const md=`${month}-${d}`;
  if(KR_FIXED.includes(md)) return true;
  const ex=KR_EXTRA[year]; if(ex&&ex.includes(md)) return true;
  if(!_subCache[year])_subCache[year]=_calcSubs(year);
  const noSub = KR_NO_SUB[year] || [];
  return _subCache[year].has(md) && !noSub.includes(md);
}

/* ── MES 작업지시 로드 (날짜 선택 시) ── */
async function specLoadMes(dateStr){
  const carModel=_getCarModel();
  const lineName=_getCarLineName();
  const badge=document.getElementById('spec-car-badge');
  if(badge) badge.textContent=lineName?(carModel+' · '+lineName):(carModel||'전체 차종');

  _specMesLoaded=false;
  specRenderTable(); // 로딩 중 표시

  // 라인 제품 목록 로드 (선택 날짜 기준 생산시작예정일 매칭)
  if(lineName && dateStr){
    AIT_API.getSpecLineProducts(lineName,dateStr).then(res=>{
      const raw=Array.isArray(res)?res[0]:res;
      const list=(raw&&raw.partNos)||[];
      _specLinePartNos=list.length>0?new Set(list):null;
      specRenderTable();
    }).catch(()=>{_specLinePartNos=null;specRenderTable();});
  }else{
    _specLinePartNos=null;
  }

  try{
    const res=await AIT_API.getSpecMes(dateStr,carModel,lineName); // lineName 우선, 없으면 carModel fallback (n8n에서 처리)
    // 응답 형식: [{data:[...]}] | {data:[...]} | [...] 모두 처리
    const payload=Array.isArray(res)?res[0]:res;
    const items=Array.isArray(payload)?payload:((payload&&payload.data)||[]);
    console.log('[specMES]',dateStr,'car:',carModel,'line:',lineName,'→ items:',items.length, items[0]||'(없음)');
    _specMesMap={};
    items.forEach(r=>{
      if(!r.part_no) return;
      // 중복 색상코드 제거 (예: 92850-N1500NM5NM5 → 92850-N1500NM5)
      const pn=r.part_no.replace(/([A-Z0-9]{3})\1$/,'$1');
      const nr=pn!==r.part_no?{...r,part_no:pn}:r;
      _specMesMap[pn]=nr;
      // 카탈로그는 색상코드 없는 기본 품번 사용 (예: 92850-N1500NM5 → 92850-N1500)
      const base=pn.replace(/[A-Z]{2}[A-Z0-9]$/,'');
      if(base && base!==pn && !_specMesMap[base]) _specMesMap[base]=nr;
    });
    _specMesLoaded=true;
    specRenderTable();
  }catch(e){
    _specMesMap={};
    _specMesLoaded=true;
    specRenderTable();
  }
}

/* ── 테이블 렌더 (카탈로그 + MES 오버레이) ── */
function specRenderTable(){
  const wrap=document.getElementById('spec-table-wrap');
  if(!wrap) return;
  const _shipBtn=document.getElementById('spec-bulk-ship-btn');
  if(_shipBtn) _shipBtn.style.display=(_specTab==='orders')?'':'none';
  if(!_specCatalog.length){
    wrap.innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">카탈로그 로드 중...</div>';
    return;
  }

  const hasMes=Object.keys(_specMesMap).length>0;

  // 작업지시 탭: MES 데이터만 표시
  if(_specTab==='orders'){
    if(!_specMesLoaded){
      wrap.innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">작업지시 조회 중...</div>';
      return;
    }
    if(!hasMes){
      wrap.innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">해당 날짜에 작업지시가 없습니다<br><span style="font-size:19px">전체 리스트 탭에서 전체 품목을 볼 수 있습니다</span></div>';
      return;
    }
    _specEnsureReqedCd();   // 이미 출고요청된 완제품 도번 로드(지연) → 배지/경고용
  }

  let rows;
  if(_specTab==='orders'){
    // MES 색상코드 포함 part_no 기반으로 rows 구성 (928A2-N1010NNB 등)
    const ln=_getCarLineName();
    rows=Object.keys(_specMesMap)
      .filter(k=>_specMesMap[k].part_no===k)
      .map(k=>{
        const base=k.replace(/[A-Z]{2}[A-Z0-9]$/,'');
        const cat=_specCatalog.find(c=>c.part_no===base)||_specCatalog.find(c=>c.part_no===k)||null;
        const mesData=_specMesMap[k]||{};
        return cat?{...cat,part_no:k,_base:base,bom_part_no:mesData.bom_part_no||k}:null;
      })
      .filter(r=>r&&(!ln||!r.line_name||r.line_name===ln))
      .sort((a,b)=>b.part_no.localeCompare(a.part_no));
  } else {
    rows=_specCatalog;
    if(_specTab==='catalog'){
      const ln=_getCarLineName();
      if(ln) rows=rows.filter(r=>!r.line_name||r.line_name===ln);
    }
  }
  if(_specSearchQ) rows=rows.filter(r=>(r.part_no||'').toLowerCase().includes(_specSearchQ)||(r.option_name||'').toLowerCase().includes(_specSearchQ));

  const badge=document.getElementById('spec-count-badge');
  if(badge){
    const mesCount=_specTab==='orders'?rows.length:rows.filter(r=>_specMesMap[r.part_no]).length;
    badge.textContent=hasMes?`${mesCount}건 작업지시 / 전체 ${rows.length}`:` 전체 ${rows.length}`;
  }

  if(!rows.length){
    if(_specTab==='orders' && hasMes){
      const mesCnt=Object.keys(_specMesMap).filter(k=>_specMesMap[k].part_no===k).length;
      const ln=_getCarLineName();
      wrap.innerHTML=`<div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">
        표시할 항목이 없습니다<br>
        <span style="font-size:17px;color:#ef4444">MES ${mesCnt}건 조회됐으나 사양표 카탈로그에 없거나 라인 불일치</span><br>
        <span style="font-size:15px;margin-top:8px;display:block">현재 라인: <b>${ln||'(없음)'}</b> · 브라우저 콘솔(F12)에서 [specMES] 로그 확인</span>
      </div>`;
    } else {
      wrap.innerHTML='<div style="padding:40px;text-align:center;color:#9ca3af;font-size:21px">검색 결과 없음</div>';
    }
    return;
  }

  // ── 전체 리스트: 컬러별 그룹 렌더 ──────────────────
  if(_specTab==='catalog'){
    // color_code가 콤마로 여러 개인 경우 각 컬러별로 확장
    const expanded=[];
    rows.forEach(row=>{
      const colors=(row.color_code||'').split(',').map(c=>c.trim()).filter(Boolean);
      if(!colors.length) expanded.push({...row,_color:'미분류'});
      else colors.forEach(c=>expanded.push({...row,_color:c}));
    });
    // 컬러 순서 유지하며 그룹화
    const colorGroups={}, colorOrder=[];
    expanded.forEach(row=>{
      if(!colorGroups[row._color]){colorGroups[row._color]=[];colorOrder.push(row._color);}
      colorGroups[row._color].push(row);
    });
    const COLOR_BG={'YGU':'#FEF9C3','NNB':'#E0F2FE','YUB':'#FCE7F3','MDE':'#DCFCE7','VKN':'#FEE2E2','SOS':'#EDE9FE','RZP':'#FFF7ED','NM5':'#F0FDF4','TS5':'#ECFDF5','NNB':'#E0F2FE'};
    let html=`<table style="width:100%;border-collapse:collapse;font-size:20px">
      <thead><tr style="background:#1e3264;color:#fff;position:sticky;top:0;z-index:1">
        <th style="padding:8px;text-align:center;width:52px">부품도</th>
        <th style="padding:8px;text-align:left;min-width:150px">도번</th>
        <th style="padding:8px;text-align:center;width:90px">구분</th>
        <th style="padding:8px;text-align:left">품명</th>
        <th style="padding:8px;text-align:center;width:40px">BOM</th>
        <th style="padding:8px;text-align:left;width:100px">작업지시번호</th>
        <th style="padding:8px;text-align:right;width:44px">수량</th>
      </tr></thead><tbody>`;
    colorOrder.forEach(color=>{
      const secBg=COLOR_BG[color]||'#F3F4F6';
      colorGroups[color].forEach((row,ri)=>{
        const mes=_specMesMap[row.part_no]||null;
        const isSel=row.part_no===_specSelectedPartNo;
        const hasMesRow=!!mes;
        const bg=isSel?'#eef2ff':(hasMesRow?'#f0fdf4':secBg);
        const tu=row.file_id?AIT_API.driveUrl(row.file_id):(_specDriveIndex[row._base||row.part_no]?AIT_API.driveUrl(_specDriveIndex[row._base||row.part_no]):(mes&&mes.file_id?AIT_API.driveUrl(mes.file_id):''));
        const thumb=tu
          ?`<img src="${tu}" style="width:40px;height:40px;object-fit:cover;border-radius:4px" onerror="this.style.display='none'">`
          :`<div style="width:40px;height:40px;background:#e5e7eb;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#d1d5db;font-size:16px">▣</div>`;
        const mesBadge=hasMesRow?`<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-right:4px;vertical-align:middle"></span>`:'';
        const nm=row.option_name||_specItemNames[row.part_no]||'';
        const bomKey=(row._color&&row._color!=='미분류'&&!row.part_no.endsWith(row._color))?(row.part_no+row._color):row.part_no;
        html+=`<tr data-pn="${row.part_no}" data-bg="${bg}" onclick="specSelectRow('${bomKey}','${row.part_no}')"
          style="background:${bg};border-bottom:1px solid #e5e7eb;cursor:pointer">
          <td style="padding:5px 8px;text-align:center">${thumb}</td>
          <td style="padding:5px 8px;font-weight:600;color:#1e3264;font-family:monospace;font-size:19px;white-space:nowrap">${mesBadge}${row.part_no||''}${_colorBadge(row._color)}</td>
          <td style="padding:5px 8px;text-align:center">${_partTypeBadge(row.part_no)}</td>
          <td style="padding:5px 8px;font-size:18px;color:#374151">${nm}</td>
          <td style="padding:5px 8px;text-align:center;color:#6b7280;font-size:19px">${row.bom_count||0}</td>
          <td style="padding:5px 8px;font-family:monospace;font-size:18px;color:#6b7280">${mes?mes.no_mmmo||'':''}</td>
          <td style="padding:5px 8px;text-align:right;font-weight:600;color:${hasMesRow?'#16a34a':'#9ca3af'}">${mes?mes.qt_order||'':''}</td>
        </tr>`;
      });
    });
    wrap.innerHTML=html+'</tbody></table>';
    return;
  }

  // ── 작업지시 탭 렌더 ─────────────────────────────
  _specOrderRowMeta = {};
  const _autoTs = _specAutoTimeSlot();
  let html=`<table style="width:100%;border-collapse:collapse;font-size:20px">
    <thead><tr style="background:#1e3264;color:#fff;position:sticky;top:0;z-index:1">
      <th style="padding:8px;text-align:center;width:44px">NO.</th>
      <th style="padding:8px;text-align:left;min-width:120px">도번</th>
      <th style="padding:8px;text-align:center;width:90px">구분</th>
      <th style="padding:8px;text-align:left;min-width:90px">품명</th>
      <th style="padding:8px;text-align:center;width:40px">BOM</th>
      <th style="padding:8px;text-align:left;width:100px">작업지시번호</th>
      <th style="padding:8px;text-align:right;width:44px">수량</th>
      <th style="padding:8px;text-align:center;width:96px">출고시간대</th>
      <th style="padding:8px;text-align:center;width:84px">출고요청수량</th>
      <th style="padding:8px;text-align:center;width:64px">출고요청<br><input type="checkbox" id="spec-ship-chk-all" onclick="event.stopPropagation();specToggleAllShip(this)" style="width:18px;height:18px;cursor:pointer"></th>
    </tr></thead><tbody>`;

  rows.forEach((row,idx)=>{
    const mes=_specMesMap[row.part_no]||null;
    const isSel=row.part_no===_specSelectedPartNo;
    const hasMesRow=!!mes;
    const _isReqed=_specReqedCd.has(String(row.bom_part_no||row.part_no));   // 이미 출고요청됨
    const bg=isSel?'#eef2ff':(_isReqed?'#fff7ed':(hasMesRow?'#f0fdf4':'#fff'));
    const mesBadge=hasMesRow
      ?`<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-right:4px;vertical-align:middle"></span>`:'';
    const nm=row.option_name||_specItemNames[row._base||row.part_no]||(mes&&mes.nm_item)||'';
    const colorCode=row.bom_part_no?(row.bom_part_no.replace(row._base||row.part_no,'').substring(0,3)):'';
    const shipKey=row.bom_part_no||row.part_no;            // BOM 조회 키(색상 포함)
    const qtyDefault=(mes&&mes.qt_order)?parseInt(mes.qt_order)||0:0;
    const noBom=!(row.bom_count>0);                         // BOM 0건 → 출고요청 불가
    _specOrderRowMeta[shipKey]={cd_item:shipKey,color_code:colorCode,product_name:nm,work_order_no:(mes&&mes.no_mmmo)||'',qt_order:qtyDefault,bom_count:row.bom_count||0};
    html+=`<tr data-pn="${row.part_no}" onclick="specSelectRow('${row.part_no}','${row._base||row.part_no}')"
      style="background:${bg};border-bottom:1px solid #f0f0f0;cursor:pointer">
      <td style="padding:5px 8px;text-align:center;font-weight:800;color:#64748b;font-size:18px">${idx+1}</td>
      <td style="padding:5px 8px;font-weight:600;color:#1e3264;font-family:monospace;font-size:19px;white-space:nowrap">${mesBadge}${row._base||row.part_no||''}${_colorBadge(colorCode)}${_specReqedBadge(shipKey)}</td>
      <td style="padding:5px 8px;text-align:center">${_partTypeBadge(row._base||row.part_no)}</td>
      <td style="padding:5px 8px;font-size:19px;color:#374151">${nm}</td>
      <td style="padding:5px 8px;text-align:center;color:#6b7280;font-size:19px">${row.bom_count||0}</td>
      <td style="padding:5px 8px;font-family:monospace;font-size:18px;color:#6b7280">${mes?mes.no_mmmo||'':''}</td>
      <td style="padding:5px 8px;text-align:right;font-weight:600;color:${hasMesRow?'#16a34a':'#9ca3af'}">${mes?mes.qt_order||'':''}</td>
      <td style="padding:3px 4px;text-align:center" onclick="event.stopPropagation()">${noBom?'-':`<select class="ship-ts" data-pn="${shipKey}" onchange="_specTsColor(this)" style="font-size:15px;padding:2px 2px 2px 6px;font-weight:700;border-left:8px solid ${_tsBarColor(_autoTs)};background:${_tsBarColor(_autoTs)}1a">${_specTsOptions(_autoTs)}</select>`}</td>
      <td style="padding:3px 4px;text-align:center" onclick="event.stopPropagation()">${noBom?'-':`<input type="number" min="0" class="ship-qty" data-pn="${shipKey}" value="${qtyDefault}" style="width:68px;font-size:16px;padding:3px;text-align:right">`}</td>
      <td style="padding:3px 4px;text-align:center" onclick="event.stopPropagation()">${noBom?`<span title="BOM 없음" style="color:#cbd5e1">✕</span>`:`<input type="checkbox" class="ship-chk" data-pn="${shipKey}" onchange="specUpdateShipSelCount()" style="width:18px;height:18px;cursor:pointer">`}</td>
    </tr>`;
  });
  wrap.innerHTML=html+'</tbody></table>';
}

/* ── 행 선택 → 모달 오픈 ── */
// bomPartNo: BOM API 조회용 도번 (컬러 포함, 예: 928A2-N1000MDE)
// catalogPartNo: 카탈로그 표시용 원본 cd_item (컬러 없음, 예: 928A2-N1000)
window.specSelectRow = async function(bomPartNo, catalogPartNo){
  const displayPartNo = catalogPartNo || bomPartNo;
  _specSelectedPartNo=displayPartNo;
  _specSelectedCdItem=displayPartNo;
  _specModalBomPartNo=bomPartNo;   // 색상 포함 도번(출고요청 cd_item)
  document.querySelectorAll('#spec-table-wrap tr[data-pn]').forEach(tr=>{
    const mes=_specMesMap[tr.dataset.pn];
    const origBg=tr.dataset.bg||(mes?'#f0fdf4':'#fff');
    tr.style.background=tr.dataset.pn===displayPartNo?'#eef2ff':origBg;
  });

  const modal=document.getElementById('spec-bom-modal');
  const body=document.getElementById('spec-modal-body');
  const titleEl=document.getElementById('spec-modal-title');
  const subEl=document.getElementById('spec-modal-sub');
  const mesInfo=_specMesMap[displayPartNo]||{};
  const catalogItem=_specCatalog.find(c=>c.part_no===displayPartNo)||{};

  if(titleEl) titleEl.innerHTML=`${bomPartNo} ${_partTypeBadge(bomPartNo)}`;
  if(subEl){
    const parts=[];
    if(catalogItem.option_name) parts.push(catalogItem.option_name);
    if(mesInfo.nm_item) parts.push(mesInfo.nm_item);
    else if(mesInfo.qt_order) parts.push(`작업지시 수량: ${mesInfo.qt_order}`);
    subEl.textContent=parts.join(' | ');
  }
  if(body) body.innerHTML='<div style="text-align:center;color:#9ca3af;padding:40px">BOM 로드 중...</div>';
  if(modal) modal.style.display='flex';

  try{
    const bom=await AIT_API.getSpecBom(bomPartNo);
    _specBomData=Array.isArray(bom)?bom:[];
    specRenderModal(_specBomData);
  }catch(e){
    if(body) body.innerHTML=`<div style="text-align:center;color:#ef4444;padding:40px">로드 실패: ${e.message}</div>`;
  }
};

window.specCloseModal=function(){
  document.getElementById('spec-bom-modal').style.display='none';
  _specSelectedPartNo=null;
  _specSelectedCdItem=null;
  _specBomDeleted.clear();
  const saveBtn=document.getElementById('spec-modal-save-btn');
  if(saveBtn) saveBtn.style.display='none';
  document.querySelectorAll('#spec-table-wrap tr[data-pn]').forEach(tr=>{
    const mes=_specMesMap[tr.dataset.pn];
    tr.style.background=tr.dataset.bg||(mes?'#f0fdf4':'#fff');
  });
};

// ESC closes modal (출고요청 모달이 열려있으면 그것부터 닫기)
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const cm=document.getElementById('spec-confirm-modal'); if(cm&&cm.style.display!=='none'){ specConfirmClose(false); return; } const sm=document.getElementById('spec-ship-modal'); if(sm&&sm.style.display!=='none'){ specShipModalClose(); } else { specCloseModal(); } } });

/* ── 모달 렌더 ── */
function specRenderModal(bom){
  const body=document.getElementById('spec-modal-body');
  if(!body) return;
  const visibleBom=bom.filter(r=>!_specBomDeleted.has(String(r.sub_part_no)))
    .sort((a,b)=>String(b.sub_part_no||'').localeCompare(String(a.sub_part_no||''),undefined,{numeric:true,sensitivity:'base'}));
  if(!visibleBom.length){
    body.innerHTML='<div style="text-align:center;color:#9ca3af;padding:40px">BOM 정보 없음</div>';
    return;
  }
  const html=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px">
    ${visibleBom.map((row)=>{
      // 정렬/필터된 visibleBom의 인덱스가 아니라 원본 _specBomData 인덱스를 써야 핸들러가 올바른 부품을 가리킨다
      const idx=_specBomData.findIndex(r=>String(r.sub_part_no)===String(row.sub_part_no));
      const photo=row.photos&&row.photos[0]?row.photos[0]:null;
      const driveFileId=!photo&&row.sub_part_no?_specDriveIndex[String(row.sub_part_no)]:null;
      const imgUrl=photo
        ?(AIT_API.normalizePhotoUrl(photo.photo_url)||AIT_API.driveUrl(photo.file_id))
        :(driveFileId?AIT_API.driveUrl(driveFileId):'');
      const imgFallback=driveFileId?`https://drive.google.com/uc?export=view&id=${driveFileId}`:'';
      const photoCount=row.photos?row.photos.length:0;
      const uploadBtn=_specEditMode
        ?`<label style="position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;
            border-radius:4px;padding:2px 7px;font-size:18px;cursor:pointer;white-space:nowrap">
            + 사진<input type="file" accept="image/*" style="display:none"
              onchange="specUploadPartPhoto(event,'${row.sub_part_no}',${idx})"></label>`
        :'';
      const delBtn=(photo&&_specEditMode)
        ?`<button onclick="event.stopPropagation();specDeletePartPhoto('${photo.file_id}','${row.sub_part_no}',${photo.photo_order||0},${idx})"
            style="position:absolute;top:4px;right:4px;background:#ef4444;color:#fff;border:none;
            border-radius:50%;width:18px;height:18px;font-size:19px;cursor:pointer;line-height:18px;padding:0">✕</button>`
        :'';
      const countBadge=photoCount>1
        ?`<span style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;
            border-radius:4px;padding:1px 5px;font-size:18px">${photoCount}장</span>`
        :'';
      const bomDelBtn=_specEditMode
        ?`<button onclick="specDeleteBomRow('${row.sub_part_no}')"
            style="width:100%;margin-top:6px;padding:4px 0;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;
            border-radius:5px;font-size:17px;cursor:pointer;font-weight:600">🗑 부품 삭제</button>`
        :'';
      return `<div style="background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden">
        <div style="position:relative;height:160px;background:#f3f4f6;cursor:pointer"
          onclick="specViewPartPhotos(${idx})">
          ${imgUrl
            ?`<img src="${imgUrl}" data-fb="${imgFallback}" style="width:100%;height:100%;object-fit:contain;background:#f8fafc;padding:4px;cursor:zoom-in"
                onclick="event.stopPropagation();openPhoto(this)"
                onerror="if(this.dataset.fb&&!this.dataset.tried){this.dataset.tried='1';this.src=this.dataset.fb;}else{this.outerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;color:#d1d5db;font-size:36px\\'>▣</div>';}">`
            :`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#d1d5db;font-size:36px">▣</div>`}
          ${countBadge}${uploadBtn}${delBtn}
        </div>
        <div style="padding:8px 10px">
          <div style="font-family:monospace;font-size:19px;color:#1e3264;font-weight:600;margin-bottom:3px">${row.sub_part_no||''}</div>
          <div style="font-size:19px;color:#374151;line-height:1.35;margin-bottom:4px">${row.part_name||''}</div>
          <div style="font-size:18px;color:#6b7280">수량: <strong>${row.qty||1}</strong></div>
          <button onclick="event.stopPropagation();specRequestPart(${idx})" style="width:100%;margin-top:6px;padding:5px 0;background:#dcfce7;color:#15803d;border:1px solid #86efac;border-radius:5px;font-size:17px;cursor:pointer;font-weight:700">📦 출고요청</button>
          ${bomDelBtn}
        </div>
      </div>`;
    }).join('')}
  </div>`;
  body.innerHTML=html;
}

/* ── 모달 편집 토글 ── */
window.specModalToggleEdit=function(btn){
  if(!_specEditMode){
    const pw=prompt('비밀번호를 입력하세요');
    if(pw!=='ait1234'){alert('비밀번호가 올바르지 않습니다.');return;}
  }
  _specEditMode=!_specEditMode;
  btn.textContent=_specEditMode?'✓ 완료':'✏ 편집';
  btn.style.background=_specEditMode?'rgba(255,255,255,.2)':'transparent';
  specRenderModal(_specBomData);
};

/* ── 부품별 사진 업로드 ── */
window.specUploadPartPhoto=async function(evt,subPartNo,rowIdx){
  const file=evt.target.files[0]; if(!file||_specUploading) return;
  _specUploading=true;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      showSaving();
      const row=_specBomData[rowIdx]||{};
      const order=(row.photos||[]).length;
      const res=await AIT_API.uploadSpecPhoto({cd_item:subPartNo,photo_order:order,filename:file.name,base64:e.target.result});
      if(!_specBomData[rowIdx].photos) _specBomData[rowIdx].photos=[];
      _specBomData[rowIdx].photos.push({file_id:res.fileId,photo_url:res.url,photo_order:order});
      specRenderModal(_specBomData);
      showToast('업로드 완료','success');
    }catch(err){ showToast('업로드 실패: '+err.message,'error'); }
    finally{ _specUploading=false; hideSaving(); }
  };
  reader.readAsDataURL(file);
};

/* ── 부품별 사진 삭제 ── */
window.specDeletePartPhoto=async function(fileId,subPartNo,photoOrder,rowIdx){
  if(!confirm('사진을 삭제하시겠습니까?')) return;
  try{
    await AIT_API.deleteSpecPhoto({fileId,cd_item:subPartNo,photo_order:photoOrder});
    if(_specBomData[rowIdx]?.photos)
      _specBomData[rowIdx].photos=_specBomData[rowIdx].photos.filter(p=>p.file_id!==fileId);
    specRenderModal(_specBomData);
    showToast('삭제 완료','success');
  }catch(e){ showToast('삭제 실패: '+e.message,'error'); }
};

/* ── BOM 부품 삭제 (staged) ── */
window.specDeleteBomRow=function(subPartNo){
  if(!confirm(`부품 ${subPartNo} 을(를) BOM에서 삭제하시겠습니까?\n저장 버튼을 눌러야 DB에 반영됩니다.`)) return;
  _specBomDeleted.add(String(subPartNo));
  document.getElementById('spec-modal-save-btn').style.display='';
  specRenderModal(_specBomData);
};

/* ── BOM 변경 저장 ── */
window.specSaveBomChanges=async function(){
  if(!_specBomDeleted.size) return;
  const partNo=_specSelectedPartNo;
  if(!partNo){ showToast('품번 정보가 없습니다.','error'); return; }
  showSaving();
  try{
    for(const subPartNo of _specBomDeleted){
      await AIT_API.deleteSpecBomRow(partNo, subPartNo);
    }
    _specBomData=_specBomData.filter(r=>!_specBomDeleted.has(String(r.sub_part_no)));
    _specBomDeleted.clear();
    document.getElementById('spec-modal-save-btn').style.display='none';
    specRenderModal(_specBomData);
    showToast('저장 완료','success');
  }catch(e){
    showToast('저장 실패: '+e.message,'error');
  }finally{ hideSaving(); }
};

/* ── 부품 사진 전체보기 (라이트박스) ── */
window.specViewPartPhotos=function(rowIdx){
  const row=_specBomData[rowIdx]; if(!row||!row.photos||!row.photos.length) return;
  const url=AIT_API.normalizePhotoUrl(row.photos[0].photo_url)||AIT_API.driveUrl(row.photos[0].file_id);
  if(typeof openLightbox==='function') openLightbox(url,row.part_name||row.sub_part_no||'');
};

/* ── 편집 모드 (툴바 버튼) ── */
window.specToggleEdit=function(btn){
  const paneEl=document.getElementById('pane-spec');
  if(_specEditMode){
    const save=confirm('데이터를 저장하겠습니까?\n\n[확인] 예 — 저장\n[취소] 아니오 — 저장하지 않고 나가기');
    if(save){
      if(typeof saveDocument==='function') saveDocument('spec');
    }else{
      _specEditMode=false;
      if(paneEl) paneEl.classList.remove('edit-mode');
      if(typeof _syncSidebarReset==='function') _syncSidebarReset();
      btn.textContent='✏ 편집 모드';
      btn.classList.remove('btn-primary');
      btn.classList.add('btn-ghost');
      btn.style.background='';
      btn.style.color='';
    }
  }else{
    const pw=prompt('비밀번호를 입력하세요');
    if(pw!=='ait1234'){alert('비밀번호가 올바르지 않습니다.');return;}
    _specEditMode=true;
    if(paneEl) paneEl.classList.add('edit-mode');
    if(typeof _syncSidebarReset==='function') _syncSidebarReset();
    btn.textContent='✓ 편집 완료';
    btn.classList.remove('btn-ghost');
    btn.classList.add('btn-primary');
    btn.style.background='';
    btn.style.color='';
  }
};

window.specSetEditable=function(on){
  _specEditMode=!!on;
};

/* ── 초기화 ── */
(function(){
  const today=new Date();
  _specDay=today.getDate();
  const sel=document.getElementById('spec-sel-date');
  if(sel) sel.textContent=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(_specDay).padStart(2,'0')}`;
  specSwitchTab('orders');
  specRenderDayPicker();
  // 카탈로그 로드 후 오늘 MES 오버레이
  specLoadCatalog().then(()=>specLoadMes(_fmtDate(today.getFullYear(),today.getMonth()+1,_specDay)));
})();

})();
</script>
