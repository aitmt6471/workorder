<!-- CP 탭 -->
<div class="tab-toolbar">
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:15px;font-weight:900;color:#1e3264;letter-spacing:2px">관리계획서</span>
    <div style="width:1px;height:16px;background:var(--border)"></div>
    <span id="cp-rev-badge" style="font-size:13px;font-weight:700;color:#111827">Rev. 0</span>
    <span id="cp-rev-date" style="font-size:13px;color:#374151">개정일: -</span>
    <button class="btn btn-ghost btn-sm" onclick="openRevModal('cp')">이력</button>
  </div>
  <div style="flex:1"></div>
  <button class="btn btn-ghost btn-sm" onclick="cpExpandAll(true)">&#x25BC; 펼치기</button>
  <button class="btn btn-ghost btn-sm" onclick="cpExpandAll(false)">&#x25B2; 접기</button>
  <button class="btn btn-ghost btn-sm" onclick="(function(){var pw=prompt('비밀번호를 입력하세요');if(pw!=='ait1234'){alert('비밀번호가 올바르지 않습니다.');return;}cpResetToDefault();})()" style="color:#ef4444;border-color:rgba(239,68,68,.4)">&#x21BA; CP 초기화</button>
  <button class="btn btn-ghost btn-sm edit-only" onclick="(function(){var pw=prompt('비밀번호를 입력하세요');if(pw!=='ait1234'){alert('비밀번호가 올바르지 않습니다.');return;}deleteEmptyCpRows();})()" style="color:#ef4444;border-color:rgba(239,68,68,.4)">&#x1F5D1; 빈 행 삭제</button>
  <button class="btn btn-ghost btn-sm edit-only" onclick="addCpRow()">&#xFF0B; 항목 추가</button>
  <button class="btn btn-ghost btn-sm edit-only" onclick="saveDocument('cp')">저장</button>
  <button class="btn btn-ghost btn-sm" onclick="window.print_cp && window.print_cp()">🖨 인쇄</button>
  <button class="btn btn-ghost btn-sm" id="cp-edit-btn" onclick="toggleTabEditMode('cp', this)">&#x270F; 편집 모드</button>
</div>

<!-- ── CP 메타 바 ── -->
<div id="cp-meta-bar" style="background:#f8faff;border-bottom:2px solid #dce6f7;padding:7px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px">
  <!-- 읽기모드: 단계 텍스트 -->
  <span id="cp-stage-view" style="font-weight:700;color:#1e3264;font-size:12px;background:#edf3ff;border-radius:6px;padding:3px 10px"></span>
  <!-- 편집모드: 라디오 -->
  <div class="edit-only" style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:3px 10px">
    <label style="display:flex;align-items:center;gap:3px;cursor:pointer;font-size:11px;font-weight:600">
      <input type="radio" name="cp-stage" id="cp-stage-start" value="시작" style="accent-color:#1e3264" onchange="saveCpMetaOnChange()"> 시작
    </label>
    <span style="color:#d1d5db;margin:0 2px">|</span>
    <label style="display:flex;align-items:center;gap:3px;cursor:pointer;font-size:11px;font-weight:600">
      <input type="radio" name="cp-stage" id="cp-stage-mass" value="양산" style="accent-color:#1e3264" onchange="saveCpMetaOnChange()"> 양산
    </label>
  </div>
  <span style="color:#d1d5db">|</span>
  <span style="font-size:11px;color:#6b7280">라인명</span>
  <span id="cp-meta-linename" contenteditable="false" oninput="saveCpMetaOnChange()"
    style="font-weight:700;color:#1e3264;font-size:12px;min-width:20px;display:inline-block"></span>
  <span style="color:#d1d5db">|</span>
  <span style="font-size:11px;color:#6b7280">차종</span>
  <span id="cp-meta-model" style="font-weight:700;color:#1e3264;font-size:12px"></span>
  <span style="color:#d1d5db">|</span>
  <span style="font-size:11px;color:#6b7280">품번</span>
  <span id="cp-meta-partno" style="font-weight:700;color:#1e3264;font-size:12px;padding:1px 3px"></span>
  <span style="color:#d1d5db">|</span>
  <span style="font-size:11px;color:#6b7280">품명</span>
  <span id="cp-meta-partname" style="font-weight:700;color:#1e3264;font-size:12px;padding:1px 3px"></span>
  <button class="edit-only" onclick="openPartModal()" style="background:#fff;border:1px solid #d1d5db;border-radius:4px;padding:1px 7px;font-size:11px;cursor:pointer;color:#6b7280;line-height:1.6">수정</button>
  <div style="width:100%;display:flex;align-items:flex-start;gap:6px;padding-top:4px;border-top:1px solid #dce6f7;margin-top:2px">
    <span style="font-size:11px;color:#6b7280;white-space:nowrap;padding-top:1px">CFT</span>
    <span id="cp-cft-inline" style="font-size:11px;color:#374151;flex:1;line-height:1.6"></span>
    <button class="edit-only" onclick="openCftModal()" style="background:#fff;border:1px solid #d1d5db;border-radius:4px;padding:1px 7px;font-size:11px;cursor:pointer;color:#6b7280;line-height:1.6;white-space:nowrap">수정</button>
  </div>
</div>

<div style="padding:0 4px 16px">
  <table id="cp-table" class="data-tbl" style="table-layout:fixed;width:100%">
    <colgroup>
      <col style="width:4.5%">   <!-- 공정번호 -->
      <col style="width:7.5%">   <!-- 공정흐름도 -->
      <col style="width:8%">     <!-- 공정명 -->
      <col style="width:8%">     <!-- 설비명 -->
      <col style="width:4%">     <!-- 특별특성 -->
      <col style="width:3.5%">   <!-- F/PF -->
      <col style="width:4.5%">   <!-- 관리항목구분 -->
      <col style="width:10%">    <!-- 관리항목 -->
      <col>                       <!-- 규격/관리기준 (flex) -->
      <col style="width:6%">     <!-- 확인방법 -->
      <col style="width:4%">     <!-- 주기 -->
      <col style="width:8%">     <!-- 관리방안 -->
      <col style="width:4.5%">   <!-- 관리주체 -->
      <col style="width:9%">     <!-- 이상조치 -->
      <col style="width:6%">     <!-- 비고 -->
      <col class="edit-only" style="width:3%">  <!-- 삭제버튼 -->
    </colgroup>
    <thead>
      <tr style="background:#1e3264;color:#fff;text-align:center;vertical-align:middle">
        <th rowspan="2">공정번호</th>
        <th style="font-size:10px;padding:2px 4px;border-bottom:1px solid rgba(255,255,255,.25)">공정흐름도</th>
        <th rowspan="2">공정명</th>
        <th rowspan="2">설비명</th>
        <th rowspan="2">특별특성</th>
        <th rowspan="2">F/PF</th>
        <th rowspan="2">구분</th>
        <th rowspan="2">관리항목</th>
        <th rowspan="2">규격/관리기준</th>
        <th rowspan="2">확인방법</th>
        <th rowspan="2">주기</th>
        <th rowspan="2">관리방안</th>
        <th rowspan="2">관리주체</th>
        <th rowspan="2">이상조치</th>
        <th rowspan="2">비고</th>
        <th class="edit-only" rowspan="2"></th>
      </tr>
      <tr style="background:#1e3264;color:#fff;text-align:center;vertical-align:middle">
        <th style="padding:2px 0;font-size:9px">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;justify-items:center">
            <span>SUB</span><span>MAIN</span><span>외주</span>
          </div>
        </th>
      </tr>
    </thead>
    <tbody id="cp-tbody">
    </tbody>
  </table>
</div>

<script>
window.print_cp = async function() {
  const carSel   = document.getElementById('car-sel');
  const car      = carSel?.options[carSel?.selectedIndex]?.text || '';
  const paneEl   = document.getElementById('pane-cp');
  const cpMeta   = (typeof _cpMetaGet === 'function') ? (_cpMetaGet(car) || {}) : {};
  const stage    = paneEl?.querySelector('#cp-stage-view')?.textContent.trim()   || cpMeta.stage    || '시작';
  const line     = paneEl?.querySelector('#cp-meta-linename')?.textContent.trim() || cpMeta.linename || '';
  const model    = paneEl?.querySelector('#cp-meta-model')?.textContent.trim()    || cpMeta.carmodel || car;
  const partno   = paneEl?.querySelector('#cp-meta-partno')?.textContent.trim()   || cpMeta.partno   || '';
  const partname = paneEl?.querySelector('#cp-meta-partname')?.textContent.trim() || cpMeta.partname || '';
  const cft      = paneEl?.querySelector('#cp-cft-inline')?.textContent.trim()    || '';
  const rev      = paneEl?.querySelector('#cp-rev-badge')?.textContent.trim()     || '';
  const revDate  = paneEl?.querySelector('#cp-rev-date')?.textContent.trim()      || '';
  const revNum   = parseInt((rev || '').replace(/[^0-9]/g, '')) || 0;

  let authorSignUrl = '', authorName = '';
  let reviewerSignUrl = '', reviewerName = '';
  let approverSignUrl = '', approverName = '';
  try {
    const signs = await AIT_API.getRevisionSigns(window.currentCarId, 'cp');
    const sigMap = {};
    signs.filter(s => s.rev === revNum || s.rev === String(revNum)).forEach(s => { sigMap[s.role] = s; });
    const driveUrl = fid => (fid && typeof AIT_API.driveUrl === 'function') ? AIT_API.driveUrl(fid) : '';
    authorSignUrl   = driveUrl(sigMap.author?.sign_file_id);   authorName   = sigMap.author?.signer_name   || '';
    reviewerSignUrl = driveUrl(sigMap.reviewer?.sign_file_id); reviewerName = sigMap.reviewer?.signer_name || '';
    approverSignUrl = driveUrl(sigMap.approver?.sign_file_id); approverName = sigMap.approver?.signer_name || '';
  } catch(e) { console.warn('서명 로드 실패', e); }

  const _signCell = (imgUrl, name) => {
    const img = imgUrl ? `<img src="${imgUrl}" style="max-height:30px;max-width:56px;object-fit:contain;display:block;margin:0 auto" onerror="this.style.display='none'">` : '';
    return (img || name) ? `<div style="font-size:8px;color:#374151;margin-bottom:2px">${name}</div>${img}` : '';
  };

  const logoUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/ait-logo.png');

  const headerHtml = `
<table style="border:1.5px solid #1e3264;margin-bottom:4px;width:100%;border-collapse:collapse">
  <tr>
    <td style="width:70px;border-right:1px solid #7a90b8;padding:3px;text-align:center;vertical-align:middle">
      <img src="${logoUrl}" style="height:28px;object-fit:contain" onerror="this.style.display='none'">
    </td>
    <td style="text-align:center;font-size:18px;font-weight:900;letter-spacing:6px;color:#1e3264;padding:5px 0">관 리 계 획 서</td>
    <td style="width:190px;border-left:1px solid #7a90b8;padding:0">
      <table style="width:100%;height:100%;border-collapse:collapse">
        <tr>
          <td style="background:#1e3264;color:#fff;font-size:8px;font-weight:700;text-align:center;padding:2px;border-right:1px solid rgba(255,255,255,.3);width:33%">작성</td>
          <td style="background:#1e3264;color:#fff;font-size:8px;font-weight:700;text-align:center;padding:2px;border-right:1px solid rgba(255,255,255,.3);width:33%">검토</td>
          <td style="background:#1e3264;color:#fff;font-size:8px;font-weight:700;text-align:center;padding:2px;width:34%">승인</td>
        </tr>
        <tr>
          <td style="height:40px;border-right:1px solid #7a90b8;border-top:1px solid #7a90b8;text-align:center;vertical-align:middle;padding:2px">${_signCell(authorSignUrl, authorName)}</td>
          <td style="border-right:1px solid #7a90b8;border-top:1px solid #7a90b8;text-align:center;vertical-align:middle;padding:2px">${_signCell(reviewerSignUrl, reviewerName)}</td>
          <td style="border-top:1px solid #7a90b8;text-align:center;vertical-align:middle;padding:2px">${_signCell(approverSignUrl, approverName)}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>`;

  const metaHtml = `
<table style="border:1px solid #7a90b8;margin-bottom:4px;font-size:10px;width:100%;border-collapse:collapse">
  <tr>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">차종</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;font-weight:700;color:#1e3264">${car}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">단계</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;color:#1e3264">${stage}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">라인명</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;color:#1e3264">${line}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">품번</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;font-weight:700;color:#1e3264">${partno}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">품명</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;color:#1e3264">${partname}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">${rev}</td>
    <td style="padding:3px 8px;color:#1e3264;font-size:9px">${revDate}</td>
  </tr>
  ${cft ? `<tr><td style="background:#1e3264;color:#fff;padding:3px 7px;font-weight:700">CFT</td><td colspan="11" style="padding:3px 8px;font-size:9px;color:#374151">${cft}</td></tr>` : ''}
</table>`;

  const theadHtml = `
<tr style="background:#1e3264;color:#fff;text-align:center;vertical-align:middle">
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">공정번호</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px;border-bottom:1px solid rgba(255,255,255,.25)">공정흐름도</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">공정명</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">설비명</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">특별특성</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">F/PF</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">구분</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">관리항목</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">규격/관리기준</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">확인방법</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">주기</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">관리방안</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">관리주체</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">이상조치</th>
  <th style="background:#1e3264;color:#fff;padding:4px 3px;border:1px solid rgba(255,255,255,.2);font-size:9px" rowspan="2">비고</th>
</tr>
<tr style="background:#1e3264;color:#fff;text-align:center">
  <th style="background:#1e3264;color:#fff;padding:2px;border:1px solid rgba(255,255,255,.2);font-size:8px">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;justify-items:center"><span>SUB</span><span>MAIN</span><span>외주</span></div>
  </th>
</tr>`;

  const cpRows = [...document.querySelectorAll('#cp-tbody tr')];
  const tbodyHtml = cpRows.map(tr => {
    const cells = [...tr.querySelectorAll('td:not(.edit-only)')];
    const isParent = tr.classList.contains('cp-parent');
    const rowStyle = isParent ? 'background:#edf3ff' : '';
    return `<tr style="${rowStyle}">${cells.map(td => {
      const colspan = td.getAttribute('colspan') || '';
      const rowspan = td.getAttribute('rowspan') || '';
      return `<td style="padding:2px 3px;border:1px solid #b8c4d8;font-size:8px;vertical-align:middle;${td.style.cssText}" ${colspan ? `colspan="${colspan}"` : ''} ${rowspan ? `rowspan="${rowspan}"` : ''}>${td.innerHTML}</td>`;
    }).join('')}</tr>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>관리계획서 ${car}</title>
<style>
@page{size:A4 landscape;margin:7mm 9mm}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:10px;color:#111827}
table{border-collapse:collapse;width:100%}
.edit-only{display:none!important}
</style></head>
<body>
<div id="pset" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#1e3264;color:#fff;padding:6px 14px;display:flex;align-items:center;gap:10px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.4)"><b style="margin-right:4px">🖨 인쇄 설정</b><label>여백 <select id="pm" style="font-size:11px;padding:2px 5px;border-radius:4px;color:#111"><option value="3mm">3mm 최소</option><option value="6mm">6mm 좁게</option><option value="10mm" selected>10mm 보통</option><option value="14mm">14mm 넓게</option><option value="18mm">18mm</option></select></label><label style="margin-left:6px">배율 <select id="ps" style="font-size:11px;padding:2px 5px;border-radius:4px;color:#111"><option value="100">100%</option><option value="95" selected>95%</option><option value="90">90%</option><option value="85">85%</option><option value="80">80%</option><option value="75">75%</option></select></label><button onclick="(function(){var m=document.getElementById('pm').value,s=parseInt(document.getElementById('ps').value,10),st=document.createElement('style');st.textContent='@page{size:A4 landscape;margin:'+m+'}body{zoom:'+(s/100)+'}';document.head.appendChild(st);document.getElementById('pset').style.display='none';document.getElementById('pss').style.display='none';setTimeout(function(){window.print();},200);})()" style="margin-left:8px;padding:4px 14px;background:#fff;color:#1e3264;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">인쇄</button><span style="margin-left:8px;font-size:10px;opacity:.65">※ 설정 바는 인쇄에서 제외됩니다</span></div><div id="pss" style="height:42px"></div>
${headerHtml}
${metaHtml}
<table style="border:1px solid #7a90b8;font-size:8px">
  <thead>${theadHtml}</thead>
  <tbody>${tbodyHtml}</tbody>
</table>
</body></html>`;

  const win = window.open('', '_blank', 'width=1120,height=820');
  if (!win) { alert('팝업 차단을 해제해주세요.'); return; }
  win.document.write(html);
  win.document.close();
};
</script>
