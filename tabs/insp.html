  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:15px;font-weight:900;color:#1e3264;letter-spacing:2px">공정검사기준서</span>
    <div style="width:1px;height:16px;background:var(--border)"></div>
    <span id="insp-rev-badge" style="font-size:13px;font-weight:700;color:#111827">Rev. 0</span>
    <span id="insp-rev-date" style="font-size:13px;color:#374151">개정일: -</span>
    <button class="btn btn-ghost btn-sm" onclick="openRevModal('insp')">이력</button>
  </div>
  <div style="flex:1"></div>
  <button class="btn btn-ghost btn-sm edit-only" onclick="saveDocument('insp')">저장</button>
  <button class="btn btn-ghost btn-sm" onclick="window.print_insp && window.print_insp()">🖨 인쇄</button>
  <button id="insp-edit-btn" class="btn btn-ghost btn-sm" onclick="toggleTabEditMode('insp',this)">&#x270F; 편집 모드</button>
</div>

<!-- 공정 탭 네비 -->
<div class="process-nav" id="insp-proc-nav" style="min-height:42px"></div>

<!-- 메인 콘텐츠 -->
<div id="insp-main" style="overflow-y:auto;height:calc(100vh - 148px);background:#f4f6fb">
  <div id="insp-content" style="padding:16px 20px 32px">
    <div style="padding:80px 20px;text-align:center;color:#9ca3af">
      <div style="font-size:40px;margin-bottom:14px">&#x1F4CB;</div>
      <div style="font-size:14px;font-weight:600;color:#6b7280">로딩 중...</div>
    </div>
  </div>
</div>

<!-- 검사항목 추가 모달 -->
<div id="insp-item-modal" style="display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.45);align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;width:420px;max-width:95vw;box-shadow:0 8px 40px rgba(0,0,0,.2);overflow:hidden">
    <div style="background:#1e3264;padding:14px 18px;display:flex;align-items:center;justify-content:space-between">
      <span style="color:#fff;font-weight:700;font-size:14px">검사항목 추가</span>
    </div>
    <div style="padding:20px 18px">
      <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px">항목명</label>
      <input id="insp-item-input" type="text" placeholder="예: 바디커버 후크 설체결"
        style="width:100%;border:1px solid #d1d5db;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box"
        onfocus="this.style.borderColor='#1e3264'"
        onblur="this.style.borderColor='#d1d5db'"
        onkeydown="if(event.key==='Enter')inspAddItemConfirm();if(event.key==='Escape')inspAddItemCancel()">
    </div>
    <div style="padding:12px 18px;background:#f9fafb;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #e5e7eb">
      <button onclick="inspAddItemCancel()"
        style="border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:8px 20px;font-size:13px;cursor:pointer;font-family:inherit">취소</button>
      <button onclick="inspAddItemConfirm()"
        style="border:none;background:#1e3264;color:#fff;border-radius:6px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">추가</button>
    </div>
  </div>
</div>

<!-- CP 공정 선택 모달 -->
<div class="car-modal-overlay" id="insp-cp-picker">
  <div class="car-modal" style="width:min(480px,96vw);max-height:70vh;overflow:hidden;display:flex;flex-direction:column;padding:0">
    <div class="car-modal-hd" style="padding:14px 18px">
      <div>
        <div style="font-size:14px;font-weight:700">CP에서 공정 선택</div>
        <div style="font-size:11px;color:#6b7280;margin-top:2px">공정을 클릭하면 자동으로 추가됩니다</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('insp-cp-picker').classList.remove('open')">&#x2715;</button>
    </div>
    <div id="insp-cp-picker-body" style="overflow-y:auto;flex:1;padding:8px 12px 16px"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ── 상태 ── */
var _editMode = false;
var _carKey   = '';
var _doc      = null;
var _procId   = null;
var _signs    = {};   // 오늘 서명: { procId: [{name, signed_at}] }
var _loadTimer = null;
var _ym = null;       // 날짜 선택: 보고 있는 달 {y,m}
var _selD = 0;        // 선택한 날(일)
var _msigns = {};     // 달별 서명 기록: { 'y-m': { procId: { day: [{name,signed_at}] } } }
var _rangeErr = false;// 기간 조회 실패(서버 미배포 등)

/* ── 유틸 ── */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }

function carName(){
  var s=document.getElementById('car-sel');
  if(!s) return '';
  return (s.options[s.selectedIndex]||{}).text||'';
}

function carKey(){
  var s=document.getElementById('car-sel');
  return s?s.value:'';
}

/* 탭을 만들지 않는 공정(공정명에 '중금속'·'수입검사')을 뺀 목록 */
function visProcs(){
  if(!_doc||!_doc.procs) return [];
  return _doc.procs.filter(function(p){ return !(window.inspProcHidden&&window.inspProcHidden(p)); });
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function compressImg(file,cb){
  var img=new Image();
  var url=URL.createObjectURL(file);
  img.onload=function(){
    var MAX=700, w=img.width, h=img.height;
    if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
    else if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
    var c=document.createElement('canvas');
    c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    cb(c.toDataURL('image/jpeg',0.65));
  };
  img.src=url;
}

/* ── 데이터 ── */
function _emptyDoc(){ return {part_no:'',part_name:'',procs:[]}; }

/* CP 메타에서 품번/품명 동기화 */
function _fillPartFromCp(){
  if(!_doc) return;
  var cn=carName();
  var meta=(typeof _cpMetaGet==='function' && cn)?_cpMetaGet(cn):{};
  if(!meta.partno && !meta.partname){
    var pnoEl=document.querySelector('#pane-cp #cp-meta-partno');
    var pnmEl=document.querySelector('#pane-cp #cp-meta-partname');
    meta={partno:(pnoEl?pnoEl.textContent.trim():''),partname:(pnmEl?pnmEl.textContent.trim():'')};
  }
  if(meta.partno)   _doc.part_no  =meta.partno;
  if(meta.partname) _doc.part_name=meta.partname;
}

var _started=false;   // loadDoc 가 한 번이라도 시작됐는지 (시작 안 된 채 "로딩 중" 고정 방지용 감시)
var _lastErr='';
window.addEventListener('error',function(e){ _lastErr=String((e&&e.message)||'').slice(0,80); });
setTimeout(function(){
  if(_started) return;
  var el=document.getElementById('insp-content'); if(!el) return;
  try{ loadDoc(); }
  catch(e){
    el.innerHTML='<div style="padding:70px 20px;text-align:center;color:#6b7280"><div style="font-size:14px;font-weight:700;margin-bottom:6px">공정검사기준서를 시작하지 못했습니다</div>'
      +'<div style="font-size:12px;color:#9ca3af;margin-bottom:14px">'+esc(e&&e.message?e.message:'')+'</div>'
      +'<button onclick="inspLoadDoc()" style="padding:9px 22px;background:#1e3264;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">다시 시도</button></div>';
  }
},8000);

function loadDoc(){
  _started=true;
  _carKey=carKey();
  if(!_carKey){ _doc=null; render(); return; }

  // 브라우저에 옛 index.html/api.js가 캐시된 경우(서명 API 없음) — 한 번 새로고침해서 최신 파일을 받는다
  if(typeof AIT_API!=='undefined' && !AIT_API.MOCK && typeof AIT_API.getInspSigns!=='function'){
    var _rk='ait_insp_stale_reload';
    try{
      if(!sessionStorage.getItem(_rk)){ sessionStorage.setItem(_rk,'1'); location.reload(); return; }
    }catch(e){}
    var el0=document.getElementById('insp-content');
    if(el0) el0.innerHTML='<div style="padding:70px 20px;text-align:center;color:#6b7280;font-size:14px;font-weight:600">브라우저에 옛 버전이 저장되어 있습니다.<br>Ctrl+Shift+Delete로 캐시를 지우거나 Ctrl+F5를 눌러주세요.</div>';
    return;
  }

  // 로딩 중 표시
  var el=document.getElementById('insp-content');
  if(el) el.innerHTML='<div style="padding:80px 20px;text-align:center;color:#9ca3af">'
    +'<div style="font-size:40px;margin-bottom:14px">&#x1F4CB;</div>'
    +'<div style="font-size:14px;font-weight:600;color:#6b7280">로딩 중... <span id="insp-load-sec"></span></div>'
    +'<div id="insp-load-hint" style="font-size:12px;margin-top:8px"></div>'
    +'</div>';
  // 경과 시간 표시 — 오래 걸려도 멈춘 것인지 진행 중인지 알 수 있게
  clearInterval(_loadTimer);
  var _t0=Date.now();
  _loadTimer=setInterval(function(){
    var s=document.getElementById('insp-load-sec'); if(!s){ clearInterval(_loadTimer); return; }
    var n=Math.round((Date.now()-_t0)/1000); s.textContent='('+n+'초)';
    var h=document.getElementById('insp-load-hint');
    if(h&&n>=5) h.textContent='문서 '+_st.d+' · 이력 '+_st.r+' · 서명 '+_st.s+(_lastErr?' · 오류: '+_lastErr:'')+(n>=20?' — 서버 응답이 늦습니다. 잠시 더 기다리거나 새로고침(Ctrl+F5) 해주세요.':'');
  },1000);
  var _st={d:'…',r:'…',s:'…'};  // 단계별 진행 상태(…대기 ✓완료 ✕실패) — 멈췄을 때 어디서 멈췄는지 화면에서 확인용
  function stage(k,p){ return p.then(function(v){_st[k]='✓';return v;}); }

  if(typeof AIT_API!=='undefined' && !AIT_API.MOCK && window.currentCarId){
    Promise.all([
      stage('d',AIT_API.getInspDoc(window.currentCarId)),
      stage('r',AIT_API.getRevisions(window.currentCarId,'insp')).catch(function(){_st.r='✕';return[];}),
      stage('s',AIT_API.getInspSigns(window.currentCarId)).catch(function(){_st.s='✕';return[];})
    ]).then(function(results){
      var res=results[0], revRows=results[1]||[];
      _signs={};
      (Array.isArray(results[2])?results[2]:[]).forEach(function(s){ (_signs[s.proc_id]=_signs[s.proc_id]||[]).push(s); });
      _doc=res||_emptyDoc();
      _fillPartFromCp();
      var _t=_today(); _ym={y:_t.y,m:_t.m}; _selD=_t.d; _msigns={}; _rangeErr=false;
      if(_procId===null && visProcs().length) _procId=visProcs()[0].id;
      if(revRows.length){
        var rd={rev:0,history:[]};
        revRows.forEach(function(r){
          var rv=parseInt(r.rev)||0;
          if(rv>rd.rev) rd.rev=rv;
          rd.history.push({rev:rv,date:r.rev_date||'',user:r.author||'',desc:r.note||'',rev_display:r.rev_display||''});
        });
        rd.history.sort(function(a,b){return b.rev-a.rev;});
        if(typeof saveRevDataFor==='function') saveRevDataFor('insp',carName(),rd);
        if(typeof updateRevDisplay==='function') updateRevDisplay('insp');
      }
      render();
      inspLoadMonth();
    }).catch(function(e){
      // 불러오기 실패 — 빈 기준서를 보여주면 편집·저장 시 기존 문서를 덮어쓸 수 있으므로 오류와 재시도를 보여준다
      clearInterval(_loadTimer);
      console.warn('기준서 로드 실패', e);
      _doc=null;
      var el2=document.getElementById('insp-content');
      if(el2) el2.innerHTML='<div style="padding:70px 20px;text-align:center;color:#6b7280">'
        +'<div style="font-size:14px;font-weight:700;margin-bottom:6px">공정검사기준서를 불러오지 못했습니다</div>'
        +'<div style="font-size:12px;color:#9ca3af;margin-bottom:14px">'+esc(e&&e.message?e.message:'')+'</div>'
        +'<button onclick="inspLoadDoc()" style="padding:9px 22px;background:#1e3264;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">다시 시도</button>'
        +'</div>';
      renderNav();
      if(typeof window._inspSetLock==='function') window._inspSetLock(false); // 서명할 수 없는 상태에서 다른 메뉴까지 막지 않음
    });
    return;
  }
  _doc=_emptyDoc();
  _fillPartFromCp();
  render();
}

/* CP에서 품번/품명 변경 시 외부 호출용 */
window._inspRefreshPart=function(){
  if(!_doc) return;
  _fillPartFromCp();
  renderContent();
};

/* ── 사진 높이 동적 계산 ── */
function calcPhotoH(){
  var main=document.getElementById('insp-main');
  if(!main) return 200;
  var mainH=main.clientHeight;
  var rows=2; // 항상 2행 기준으로 높이 계산
  var reserved=272+(rows-1)*12; // 헤더테이블+마진+검사포인트바+패딩+행간격
  var perRow=(mainH-reserved)/rows;
  return Math.max(80,Math.floor(perRow-64)); // 항목제목(30)+설명여유(34)
}

/* ── 렌더 ── */
function render(){
  clearInterval(_loadTimer);
  renderNav();
  renderContent();
}

function renderNav(){
  var nav=document.getElementById('insp-proc-nav');
  if(!nav) return;
  if(!_doc){
    nav.innerHTML='<div style="color:#9ca3af;font-size:12px;padding:8px 4px">아이템을 선택하세요</div>';
    return;
  }
  if(!visProcs().length){
    nav.innerHTML='<div style="color:#9ca3af;font-size:12px;padding:8px 4px">'
      +(_editMode?'편집 모드에서 공정을 추가하세요':'공정 없음')+'</div>'
      +(_editMode?'<button class="proc-btn" style="border-style:dashed;color:#3b82f6" onclick="inspAddProc()">+ 공정 추가</button>':'');
    return;
  }
  var html='';
  visProcs().forEach(function(p){
    var act=p.id===_procId;
    var sg=(_signs[p.id]&&_signs[p.id].length)?' <span style="color:'+(act?'#86efac':'#16a34a')+';font-weight:900" title="오늘 서명 완료">&#x2713;</span>':'';
    html+='<button class="proc-btn'+(act?' active':'')+'" onclick="inspSelProc(\''+p.id+'\')">'+esc(p.proc_no)+sg+'</button>';
  });
  if(_editMode) html+='<button class="proc-btn" style="border-style:dashed;color:#3b82f6;margin-left:6px" onclick="inspAddProc()">+</button>';
  nav.innerHTML=html;
}

function renderContent(){
  var el=document.getElementById('insp-content');
  if(!el) return;

  if(!_doc){
    el.innerHTML='<div style="padding:80px 20px;text-align:center;color:#9ca3af">'
      +'<div style="font-size:40px;margin-bottom:14px">&#x1F4CB;</div>'
      +'<div style="font-size:14px;font-weight:600;color:#6b7280">아이템을 선택하세요</div>'
      +'</div>';
    return;
  }
  if(!visProcs().length){
    el.innerHTML='<div style="padding:70px 20px;text-align:center;color:#9ca3af">'
      +'<div style="font-size:36px;margin-bottom:12px">&#x1F4C4;</div>'
      +'<div style="font-size:13px;font-weight:600;color:#6b7280">등록된 공정이 없습니다</div>'
      +(_editMode?'<button onclick="inspAddProc()" style="margin-top:18px;padding:9px 22px;background:#1e3264;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">+ 공정 추가</button>':'')
      +'</div>';
    return;
  }

  var proc=null;
  var vp=visProcs();
  for(var pi=0;pi<vp.length;pi++){ if(vp[pi].id===_procId){proc=vp[pi];break;} }
  if(!proc){ proc=vp[0]; }
  _procId=proc.id;

  var cn=carName();
  var eMode=_editMode;

  var delProcBtn=eMode?'<button onclick="inspDeleteProc(\''+proc.id+'\')" style="background:none;border:1px solid #fca5a5;color:#ef4444;border-radius:4px;padding:2px 9px;cursor:pointer;font-size:11px">공정 삭제</button>':'';

  var html=inspDateBarHtml()+'<div style="background:#fff;border:1px solid #9aaabf;border-radius:6px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 4px rgba(15,23,42,.06)">'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed">'
    +'<colgroup><col style="width:58px"><col><col style="width:68px"><col><col style="width:68px"><col></colgroup>'
    +'<tbody>'
    +'<tr>'
    +'<td style="background:#1e3264;color:#fff;font-weight:600;font-size:10px;text-align:center;padding:6px 3px;border:1px solid #3a548a;vertical-align:middle">차  종</td>'
    +'<td style="border:1px solid #c8d3e0;padding:6px 8px;font-weight:700;color:#1e3264;vertical-align:middle"'+(eMode?' contenteditable="true" oninput="inspHdrInput(this,\'car_models\')"':'')+'>'+esc(proc.car_models||cn)+'</td>'
    +'<td style="background:#1e3264;color:#fff;font-weight:600;font-size:10px;text-align:center;padding:6px 3px;border:1px solid #3a548a;vertical-align:middle">품  번</td>'
    +'<td colspan="3" style="border:1px solid #c8d3e0;padding:6px 8px;font-family:monospace;font-size:11px;vertical-align:middle"'+(eMode?' contenteditable="true" oninput="inspHdrInput(this,\'part_no\')"':'')+'>'+esc(proc.part_no||_doc.part_no)+'</td>'
    +'</tr>'
    +'<tr>'
    +'<td style="background:#1e3264;color:#fff;font-weight:600;font-size:10px;text-align:center;padding:6px 3px;border:1px solid #3a548a;vertical-align:middle">품  명</td>'
    +'<td style="border:1px solid #c8d3e0;padding:6px 8px;font-weight:600;vertical-align:middle"'+(eMode?' contenteditable="true" oninput="inspHdrInput(this,\'part_name\')"':'')+'>'+esc(proc.part_name||_doc.part_name)+'</td>'
    +'<td style="background:#1e3264;color:#fff;font-weight:600;font-size:10px;text-align:center;padding:6px 3px;border:1px solid #3a548a;vertical-align:middle">공정번호</td>'
    +'<td style="border:1px solid #c8d3e0;padding:6px 8px;font-weight:700;color:#1e3264;vertical-align:middle"'+(eMode?' contenteditable="true" oninput="inspHdrInput(this,\'proc_no\')"':'')+'>'+esc(proc.proc_no)+'</td>'
    +'<td style="background:#1e3264;color:#fff;font-weight:600;font-size:10px;text-align:center;padding:6px 3px;border:1px solid #3a548a;vertical-align:middle">공정명</td>'
    +'<td style="border:1px solid #c8d3e0;padding:6px 8px;font-weight:600;vertical-align:middle"'+(eMode?' contenteditable="true" oninput="inspHdrInput(this,\'proc_name\')"':'')+'>'+esc(proc.proc_name)+'</td>'
    +'</tr>'
    +'<tr>'
    +'<td style="background:#1e3264;color:#fff;font-weight:600;font-size:10px;text-align:center;padding:6px 3px;border:1px solid #3a548a;vertical-align:middle">구  분</td>'
    +'<td style="border:1px solid #c8d3e0;padding:6px 8px;vertical-align:middle"'+(eMode?' contenteditable="true" oninput="inspHdrInput(this,\'proc_type\')"':'')+'>'+esc(proc.proc_type||'일반공정')+'</td>'
    +'<td colspan="4" style="border:1px solid #c8d3e0;padding:4px 10px;text-align:right;vertical-align:middle">'+delProcBtn+'</td>'
    +'</tr>'
    +'</tbody></table></div>';

  html+=inspSignBarHtml(proc);

  html+='<div style="background:#1e3264;color:#fff;padding:9px 16px;border-radius:4px 4px 0 0;font-weight:700;font-size:13px;display:flex;align-items:center;gap:10px">'
    +'<span>'+esc(proc.proc_no)+(proc.proc_name?' ('+esc(proc.proc_name)+')':'')+'  검사 포인트</span>'
    +'<div style="flex:1"></div>'

/* ── 날짜 선택 (설비일상점검표와 같은 월 이동 바 + 날짜 버튼 줄) ── */
var KR_FIXED=['1-1','3-1','5-5','6-6','8-15','10-3','10-9','12-25'];
var KR_EXTRA={
  2025:['1-27','1-28','1-29','3-3','10-5','10-6','10-7','10-8'],
  2026:['2-16','2-17','2-18','3-2','6-3','8-17','9-25','9-26','9-27','9-28','9-29','10-5']
};
var KR_NO_SUB={2026:['6-8']};
var _subCache={};
function _calcSubs(year){
  var subs={};
  [[1,1],[3,1],[5,5],[6,6],[8,15],[10,3],[10,9],[12,25]].forEach(function(a){
    var dw=new Date(year,a[0]-1,a[1]).getDay(), off=dw===0?1:(dw===6?2:0);
    if(off){ var s=new Date(year,a[0]-1,a[1]+off); subs[(s.getMonth()+1)+'-'+s.getDate()]=1; }
  });
  return subs;
}
function _isHol(y,m,d){   // 일요일·공휴일 (토요일 제외)
  if(new Date(y,m-1,d).getDay()===0) return true;
  var md=m+'-'+d;
  if(KR_FIXED.indexOf(md)>=0) return true;
  if((KR_EXTRA[y]||[]).indexOf(md)>=0) return true;
  if(!_subCache[y]) _subCache[y]=_calcSubs(y);
  return !!_subCache[y][md] && (KR_NO_SUB[y]||[]).indexOf(md)<0;
}
function _today(){ var t=new Date(); return {y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate()}; }
function _p2(n){ return (n<10?'0':'')+n; }
function _ymd(y,m,d){ return y+'-'+_p2(m)+'-'+_p2(d); }
function _cmpToday(y,m,d){ var t=_today(); return (y*10000+m*100+d)-(t.y*10000+t.m*100+t.d); }  // <0 지난 날, >0 앞으로의 날
function _isToday(){ return !_ym || _cmpToday(_ym.y,_ym.m,_selD)===0; }
var _DN=['일','월','화','수','목','금','토'];

function _daySigns(pid,y,m,d){
  if(_cmpToday(y,m,d)===0) return _signs[pid]||[];
  var mm=_msigns[y+'-'+m];
  return (mm&&mm[pid]&&mm[pid][d])||[];
}

function inspDateBarHtml(){

  var y=_ym.y, m=_ym.m, n=new Date(y,m,0).getDate(), loaded=!!_msigns[y+'-'+m], btns='';
  for(var d=1;d<=n;d++){
    var sat=new Date(y,m-1,d).getDay()===6, hol=_isHol(y,m,d), sel=d===_selD;

    else if(sel){ bg='#1e3264'; col='#fff'; bd='#1e3264'; }
    else if(_daySigns(_procId,y,m,d).length){ bg='#f0fdf4'; col='#16a34a'; bd='#86efac'; }
    else if(loaded && _cmpToday(y,m,d)<0){ bg='#fff5f5'; col='#ef4444'; bd='#fca5a5'; }
    btns+='<button onclick="inspSelDay('+d+')" aria-label="'+m+'월 '+d+'일" style="min-width:30px;height:30px;padding:0 4px;border:1px solid '+bd+';border-radius:6px;background:'+bg+';color:'+col+';font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;'+ex+'">'+d+'</button>';
  }
  var nb='border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:6px;padding:3px 11px;font-size:16px;cursor:pointer;line-height:1.2;font-family:inherit';
  return '<div style="margin-bottom:14px;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(15,23,42,.06)">'
    +'<div style="padding:10px 16px;background:#1e3264;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#fff">'
    +'<button onclick="inspMonth(-1)" aria-label="이전 달" style="'+nb+'">&#x2039;</button>'
    +'<span style="font-weight:700;font-size:14px;min-width:90px;text-align:center">'+y+'년 '+m+'월</span>'
    +'<button onclick="inspMonth(1)" aria-label="다음 달" style="'+nb+'">&#x203A;</button>'
    +'<span style="color:rgba(255,255,255,.35);margin:0 4px">|</span>'
    +'<span style="font-size:13px;font-weight:700;background:rgba(255,255,255,.15);padding:3px 12px;border-radius:6px;letter-spacing:.5px">'+m+'월 '+_selD+'일 ('+_DN[new Date(y,m-1,_selD).getDay()]+')</span>'
    +'<span style="margin-left:auto;font-size:12px;color:rgba(255,255,255,.8)">서명 기록</span></div>'
    +'<div style="padding:12px 16px;background:#f4f7fc;border:1px solid #c8d3e0;border-top:none;display:flex;flex-wrap:wrap;gap:4px">'+btns+'</div></div>';
}

function _rerenderKeepName(){

  renderContent();

window.inspSelDay=function(d){ _selD=d; _rerenderKeepName(); };
window.inspMonth=function(k){
  var m=_ym.m+k, y=_ym.y;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  _ym={y:y,m:m};
  var t=_today(); _selD=(y===t.y&&m===t.m)?t.d:1;
  _rerenderKeepName();
  inspLoadMonth();
};
function inspLoadMonth(){
  if(!_ym||typeof AIT_API==='undefined'||AIT_API.MOCK||!window.currentCarId||typeof AIT_API.getInspSignRange!=='function') return;
  var y=_ym.y, m=_ym.m, key=y+'-'+m;
  if(_msigns[key]) return;
  var cid=window.currentCarId, last=new Date(y,m,0).getDate();
  AIT_API.getInspSignRange(cid,_ymd(y,m,1),_ymd(y,m,last)).then(function(rows){
    if(cid!==window.currentCarId) return;
    var o={};
    (Array.isArray(rows)?rows:[]).forEach(function(r){
      var d=parseInt(String(r.sign_date||'').slice(8,10),10);
      if(!r.proc_id||!d) return;
      var byProc=(o[r.proc_id]=o[r.proc_id]||{});
      (byProc[d]=byProc[d]||[]).push({name:r.name,signed_at:r.signed_at});
    });
    _msigns[key]=o; _rangeErr=false;
    _rerenderKeepName();
  }).catch(function(){ _rangeErr=true; _rerenderKeepName(); });
}

window.inspSign=function(){
  var inp=document.getElementById('insp-sign-name'), btn=document.getElementById('insp-sign-btn');
  if(!inp||!btn||btn.disabled||!_procId) return;
  var name=inp.value.trim();
  if(!name) return;
  var pid=_procId;
  btn.disabled=true; btn.textContent='저장 중...';
  AIT_API.signInsp(window.currentCarId,pid,name).then(function(r){
    if(!r||!r.ok) throw new Error('fail');
    (_signs[pid]=_signs[pid]||[]);
    _signs[pid]=_signs[pid].filter(function(s){return s.name!==name;});
    _signs[pid].push({name:name,signed_at:r.signed_at});
    renderNav(); renderContent();
    if(typeof showToast==='function') showToast('서명되었습니다','success');
    // 모든 공정이 오늘 서명되면 다른 메뉴 잠금 해제
    if(typeof window._inspSetLock==='function' && _doc && _doc.procs){
      var left=visProcs().filter(function(p){return !(_signs[p.id]&&_signs[p.id].length);}).length;
      if(!left) window._inspSetLock(false);
    }
  }).catch(function(){
    btn.textContent='확인했습니다'; btn.disabled=false;
    if(typeof showToast==='function') showToast('서명 저장에 실패했습니다. 다시 눌러주세요.','warning');
  });
};

window.inspAddProc=function(){
  if(!_doc) return;
  var cpRows=document.querySelectorAll('#cp-tbody tr.cp-child');
  if(cpRows.length){
    var seen={}, list=[];
    for(var i=0;i<cpRows.length;i++){
      var tr=cpRows[i];
      var no=(tr.cells[0]?tr.cells[0].textContent.trim():'');
      var nm=(tr.cells[2]?tr.cells[2].textContent.trim():'');
      if(no && !seen[no]){ seen[no]=true; list.push({proc_no:no,proc_name:nm}); }
    }
    if(list.length){ _showCpPicker(list); return; }
  }
  /* CP 미로드시 수동 입력 */
  var no=prompt('공정번호 입력 (예: 1공정)'); if(!no) return;
  var nm=prompt('공정명 입력 (예: 바디+라이트가이드 조립)')||'';
  _createProc(no.trim(),nm.trim());
};

function _showCpPicker(list){
  var body=document.getElementById('insp-cp-picker-body');
  if(!body) return;
  var existing={};
  (_doc.procs||[]).forEach(function(p){ existing[p.proc_no]=true; });
  var html='';
  list.forEach(function(item,idx){
    var done=existing[item.proc_no];
    html+='<div data-idx="'+idx+'"'+(done?' data-done="1"':'')
      +' style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;'
      +'cursor:'+(done?'default':'pointer')+';background:'+(done?'#f3f4f6':'#fff')+';'
      +'border:1px solid '+(done?'#e5e7eb':'#c8d3e0')+';margin-bottom:6px;opacity:'+(done?'0.5':'1')+'">'
      +'<span style="background:#1e3264;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;white-space:nowrap;flex-shrink:0">'+esc(item.proc_no)+'</span>'
      +'<span style="font-size:12px;font-weight:600;color:#374151;flex:1">'+esc(item.proc_name)+'</span>'
      +(done?'<span style="font-size:10px;color:#9ca3af">추가됨</span>':'')
      +'</div>';
  });
  body.innerHTML=html||'<div style="padding:20px;text-align:center;color:#9ca3af;font-size:12px">CP에 공정 데이터가 없습니다</div>';

  // onclick 문자열 조합 대신 addEventListener — proc_no/proc_name 특수문자 무관하게 안전
  body.querySelectorAll('[data-idx]:not([data-done])').forEach(function(el){
    var item=list[parseInt(el.dataset.idx,10)];
    el.addEventListener('mouseover',function(){ this.style.background='#eff6ff'; this.style.borderColor='#3b82f6'; });
    el.addEventListener('mouseout', function(){ this.style.background='#fff';    this.style.borderColor='#c8d3e0'; });
    el.addEventListener('click',function(){
      document.getElementById('insp-cp-picker').classList.remove('open');
      _createProc(item.proc_no,item.proc_name);
    });
  });

  document.getElementById('insp-cp-picker').classList.add('open');
}

window.inspPickProc=function(no,nm){
  document.getElementById('insp-cp-picker').classList.remove('open');
  _createProc(no,nm);

function _createProc(no,nm){

window.inspAddItemConfirm=function(){
  var input=document.getElementById('insp-item-input');
  var nm=(input?input.value:'').trim();
  if(!nm){ if(input){ input.style.borderColor='#ef4444'; setTimeout(function(){ input.style.borderColor='#d1d5db'; },1000); } return; }
  document.getElementById('insp-item-modal').style.display='none';
  var proc=null;
  for(var i=0;i<_doc.procs.length;i++){if(_doc.procs[i].id===_addItemProcId){proc=_doc.procs[i];break;}}
  if(!proc) return;
  proc.items.push({id:uid(),name:nm,description:'',photo:'',sort_order:proc.items.length});
  renderContent();
};

window.inspAddItemCancel=function(){
  document.getElementById('insp-item-modal').style.display='none';
};

window.inspDeleteItem=function(procId,itemId){
  var proc=null;
  for(var i=0;i<_doc.procs.length;i++){if(_doc.procs[i].id===procId){proc=_doc.procs[i];break;}}
  if(!proc||!confirm('검사항목을 삭제하시겠습니까?')) return;
  proc.items=proc.items.filter(function(it){return it.id!==itemId;});
  renderContent();
};

window.inspUploadPhoto=function(procId,itemId,input){
  var proc=null;
  for(var i=0;i<_doc.procs.length;i++){if(_doc.procs[i].id===procId){proc=_doc.procs[i];break;}}
  if(!proc) return;
  var item=null;
  for(var j=0;j<proc.items.length;j++){if(proc.items[j].id===itemId){item=proc.items[j];break;}}
  if(!item) return;
  var file=input.files[0]; if(!file) return;
  compressImg(file,function(data){ item.photo=data; renderContent(); });
};

window.inspHdrInput=function(el,field){
  var proc=null;
  for(var i=0;i<_doc.procs.length;i++){if(_doc.procs[i].id===_procId){proc=_doc.procs[i];break;}}
  if(!proc) return;
  proc[field]=el.innerText.trim();
  if(field==='part_no'||field==='part_name') _doc[field]=el.innerText.trim();
};

window.inspItemInput=function(procId,itemId,el,field){
  var proc=null;
  for(var i=0;i<_doc.procs.length;i++){if(_doc.procs[i].id===procId){proc=_doc.procs[i];break;}}
  if(!proc) return;
  var item=null;
  for(var j=0;j<proc.items.length;j++){if(proc.items[j].id===itemId){item=proc.items[j];break;}}
  if(!item) return;
  item[field]=el.innerText.trim();
};

window.print_insp = async function() {
  const carKey = document.getElementById('car-sel')?.value || '';
  const car    = document.getElementById('car-sel')?.options[document.getElementById('car-sel')?.selectedIndex]?.text || '';
  const rev    = document.getElementById('insp-rev-badge')?.textContent.trim() || '';
  const revDate= document.getElementById('insp-rev-date')?.textContent.trim() || '';
  const revNum = parseInt((rev || '').replace(/[^0-9]/g, '')) || 0;

  // localStorage 대신 메모리 내 _doc 참조
  const doc = window._inspDocRef ? window._inspDocRef() : null;
  if (!doc || !doc.procs || !doc.procs.length) { alert('공정검사기준서 데이터가 없습니다.'); return; }

  let authorSignUrl = '', authorName = '';
  let reviewerSignUrl = '', reviewerName = '';
  let approverSignUrl = '', approverName = '';
  try {
    const signs = await AIT_API.getRevisionSigns(window.currentCarId, 'insp');
    const sigMap = {};
    const maxSignRev = signs.length ? Math.max(...signs.map(s => parseInt(s.rev) || 0)) : revNum;
    signs.filter(s => parseInt(s.rev) === maxSignRev).forEach(s => { sigMap[s.role] = s; });
    const driveUrl = fid => (fid && typeof AIT_API.driveUrl === 'function') ? AIT_API.driveUrl(fid) : '';
    authorSignUrl   = driveUrl(sigMap.author?.sign_file_id);   authorName   = sigMap.author?.signer_name   || '';
    reviewerSignUrl = driveUrl(sigMap.reviewer?.sign_file_id); reviewerName = sigMap.reviewer?.signer_name || '';
    approverSignUrl = driveUrl(sigMap.approver?.sign_file_id); approverName = sigMap.approver?.signer_name || '';
  } catch(e) { console.warn('서명 로드 실패', e); }

  const _signCell = (imgUrl, name) => {
    const img = imgUrl ? `<img src="${imgUrl}" style="max-height:30px;max-width:56px;object-fit:contain;display:block;margin:0 auto" onerror="this.style.display='none'">` : '';
    return (img || name) ? `<div style="font-size:8px;color:#374151;margin-bottom:2px">${name}</div>${img}` : '';
  };

  const logoUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/AIT_로고_투명배경.png');

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  const headerHtml = `
<table style="border:1.5px solid #1e3264;margin-bottom:4px;width:100%;border-collapse:collapse">
  <tr>
    <td style="width:70px;border-right:1px solid #7a90b8;padding:3px;text-align:center;vertical-align:middle">
      <img src="${logoUrl}" style="height:28px;object-fit:contain" onerror="this.style.display='none'">
    </td>
    <td style="text-align:center;font-size:18px;font-weight:900;letter-spacing:6px;color:#1e3264;padding:5px 0">공 정 검 사 기 준 서</td>
    <td style="width:190px;border-left:1px solid #7a90b8;padding:0">
      <table style="width:100%;height:100%;border-collapse:collapse">
        <tr>
          <td style="background:#1e3264;color:#fff;font-size:8px;font-weight:700;text-align:center;padding:2px;border-right:1px solid rgba(255,255,255,.3);width:33%">작성</td>
          <td style="background:#1e3264;color:#fff;font-size:8px;font-weight:700;text-align:center;padding:2px;border-right:1px solid rgba(255,255,255,.3);width:33%">검토</td>
          <td style="background:#1e3264;color:#fff;font-size:8px;font-weight:700;text-align:center;padding:2px;width:34%">승인</td>
        </tr>
        <tr>
          <td style="height:40px;border-right:1px solid #7a90b8;border-top:1px solid #7a90b8;text-align:center;vertical-align:middle;padding:2px">${_signCell(authorSignUrl, authorName)}</td>
          <td style="border-right:1px solid #7a90b8;border-top:1px solid #7a90b8;text-align:center;vertical-align:middle;padding:2px">${_signCell(reviewerSignUrl, reviewerName)}</td>
          <td style="border-top:1px solid #7a90b8;text-align:center;vertical-align:middle;padding:2px">${_signCell(approverSignUrl, approverName)}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>`;

  const pagesHtml = doc.procs.map((proc, pi) => {
    const isLast = pi === doc.procs.length - 1;
    const items = proc.items || [];

    const procMetaHtml = `
<table style="border:1px solid #7a90b8;margin-bottom:6px;font-size:10px;width:100%;border-collapse:collapse">
  <tr>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">차종</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;font-weight:700;color:#1e3264">${esc(proc.car_models || car)}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">품번</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;color:#1e3264;font-family:monospace">${esc(proc.part_no || doc.part_no || '')}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">품명</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;color:#1e3264;font-weight:600">${esc(proc.part_name || doc.part_name || '')}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">공정번호</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;color:#1e3264;font-weight:700">${esc(proc.proc_no || '')}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">공정명</td>
    <td style="padding:3px 8px;border-right:1px solid #b8c4d8;color:#1e3264">${esc(proc.proc_name || '')}</td>
    <td style="background:#1e3264;color:#fff;padding:3px 7px;white-space:nowrap;font-weight:700">구분</td>
    <td style="padding:3px 8px;color:#1e3264">${esc(proc.proc_type || '일반공정')}</td>
  </tr>
</table>`;

    const itemsGridHtml = items.length ? `
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:8px">
  ${items.map(item => `
  <div style="border:1px solid #c8d3e0;border-radius:6px;overflow:hidden">
    <div style="background:#374151;color:#fff;padding:6px 8px;font-size:10px;font-weight:700;min-height:28px;text-align:center">${esc(item.name || '항목명')}</div>
    ${item.photo ? `<img src="${item.photo}" style="width:100%;max-height:160px;object-fit:contain;background:#f3f4f6;display:block">` : `<div style="width:100%;height:120px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:10px">사진 없음</div>`}
    ${item.description ? `<div style="padding:5px 8px;font-size:9px;color:#4b5563;border-top:1px solid #e5e7eb;line-height:1.5;text-align:center">${esc(item.description)}</div>` : ''}
  </div>`).join('')}
</div>` : `<div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px;border:1px solid #e2e8f0;margin-bottom:8px">등록된 검사항목이 없습니다</div>`;

    return `<div style="${isLast ? '' : 'page-break-after:always'}">
${headerHtml}
${procMetaHtml}
<div style="background:#1e3264;color:#fff;padding:7px 12px;border-radius:4px 4px 0 0;font-weight:700;font-size:12px;margin-bottom:0">
  ${esc(proc.proc_no)}${proc.proc_name ? ' (' + esc(proc.proc_name) + ')' : ''}  검사 포인트
</div>
<div style="border:1px solid #c8d3e0;border-top:none;padding:10px;border-radius:0 0 6px 6px;margin-bottom:4px">
${itemsGridHtml}
</div>
</div>`;
  }).join('\n');

  const html = `<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>공정검사기준서 ${car}</title>
<style>
@page{size:A4 landscape;margin:7mm 9mm}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:11px;color:#111827}
table{border-collapse:collapse;width:100%}
</style></head>
<body>
<div id="pset" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#1e3264;color:#fff;padding:6px 14px;display:flex;align-items:center;gap:10px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.4)"><b style="margin-right:4px">🖨 인쇄 설정</b><label>여백 <select id="pm" style="font-size:11px;padding:2px 5px;border-radius:4px;color:#111"><option value="3mm">3mm 최소</option><option value="6mm">6mm 좁게</option><option value="10mm" selected>10mm 보통</option><option value="14mm">14mm 넓게</option><option value="18mm">18mm</option></select></label><label style="margin-left:6px">배율 <select id="ps" style="font-size:11px;padding:2px 5px;border-radius:4px;color:#111"><option value="100">100%</option><option value="95" selected>95%</option><option value="90">90%</option><option value="85">85%</option><option value="80">80%</option><option value="75">75%</option></select></label><button onclick="(function(){var m=document.getElementById('pm').value,s=parseInt(document.getElementById('ps').value,10),st=document.createElement('style');st.textContent='@page{size:A4 landscape;margin:'+m+'}body{zoom:'+(s/100)+'}';document.head.appendChild(st);document.getElementById('pset').style.display='none';document.getElementById('pss').style.display='none';setTimeout(function(){window.print();},200);})()" style="margin-left:8px;padding:4px 14px;background:#fff;color:#1e3264;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">인쇄</button><span style="margin-left:8px;font-size:10px;opacity:.65">※ 설정 바는 인쇄에서 제외됩니다</span></div><div id="pss" style="height:42px"></div>
${pagesHtml}
</body></html>`;

  const win = window.open('', '_blank', 'width=1120,height=820');
  if (!win) { alert('팝업 차단을 해제해주세요.'); return; }
  win.document.write(html);
  win.document.close();
};
</script>
