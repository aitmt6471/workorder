<!-- SPC X-bar 관리도 탭 -->
<div style="padding:18px 22px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <span style="font-size:15px;font-weight:900;color:#1e3264;letter-spacing:2px">📈 SPC · X&#772; 관리도</span>
    <span id="spc-car" style="font-size:12px;color:#64748b"></span>
  </div>

  <!-- 컨트롤 -->
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px">
    <label style="font-size:12px;color:#374151">모델
      <select id="spc-model" style="margin-left:4px;padding:5px 8px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px;max-width:200px"></select>
    </label>
    <label style="font-size:12px;color:#374151">측정항목
      <select id="spc-item" style="margin-left:4px;padding:5px 8px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px;max-width:300px"></select>
    </label>
    <label style="font-size:12px;color:#374151">부분군
      <input id="spc-n" type="number" min="2" max="10" value="5" style="width:46px;margin-left:4px;padding:5px 6px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px">
    </label>
    <label style="font-size:12px;color:#374151">UCL(수동)
      <input id="spc-ucl" type="number" step="0.001" placeholder="자동" style="width:74px;margin-left:4px;padding:5px 6px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px">
    </label>
    <label style="font-size:12px;color:#374151">LCL(수동)
      <input id="spc-lcl" type="number" step="0.001" placeholder="자동" style="width:74px;margin-left:4px;padding:5px 6px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px">
    </label>
    <span id="spc-spec" style="font-size:12px;color:#64748b"></span>
  </div>

  <!-- 지표 타일 -->
  <div id="spc-tiles" style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px"></div>

  <!-- 차트 -->
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px 18px">
    <div id="spc-chart-title" style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:8px"></div>
    <div style="width:100%;overflow-x:auto"><svg id="spc-svg" viewBox="0 0 940 360" style="width:100%;min-width:640px;height:auto;display:block"></svg></div>
    <div id="spc-foot" style="font-size:11px;color:#64748b;margin-top:8px"></div>
  </div>

  <!-- 공정능력도 -->
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px 18px;margin-top:14px">
    <div id="spc-cap-title" style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:8px"></div>
    <div style="width:100%;overflow-x:auto"><svg id="spc-cap" viewBox="0 0 940 260" style="width:100%;min-width:640px;height:auto;display:block"></svg></div>
  </div>

  <div id="spc-msg" style="margin-top:14px;font-size:13px"></div>
</div>

<script>
if (typeof initSpcTab === 'function') initSpcTab();
else console.error('js/spc.js 가 로드되지 않았습니다.');
</script>
