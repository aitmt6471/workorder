<!-- SPC X-bar 관리도 탭 -->
<div style="padding:18px 22px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <span style="font-size:15px;font-weight:900;color:#1e3264;letter-spacing:2px">📈 SPC · X&#772; 관리도</span>
    <span id="spc-car" style="font-size:12px;color:#64748b"></span>
    <span style="flex:1"></span>
    <button class="btn btn-ghost btn-sm" id="spc-edit-btn" onclick="toggleTabEditMode('spc',this)">&#x270F; 편집 모드</button>
  </div>

  <!-- 컨트롤 -->
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px">
    <label style="font-size:12px;color:#374151">모델
      <select id="spc-model" style="margin-left:4px;padding:5px 8px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px;max-width:200px"></select>
    </label>
    <label style="font-size:12px;color:#374151">측정항목
      <select id="spc-item" style="margin-left:4px;padding:5px 8px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px;max-width:300px"></select>
    </label>
    <label style="font-size:12px;color:#374151">부분군<span style="cursor:help;color:#94a3b8;margin-left:2px" title="연속된 측정값을 n개씩 묶은 단위. 부분군 평균들로 공정중심(X̄̄)을, 부분군 범위(최댓값-최솟값)들의 평균으로 공정 표준편차(σ)를 추정해 Cp/Cpk 계산에 사용합니다.">ⓘ</span>
      <input id="spc-n" type="number" min="2" max="10" value="5" style="width:46px;margin-left:4px;padding:5px 6px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px">
    </label>
    <label style="font-size:12px;color:#374151">기간
      <input id="spc-date-from" type="date" style="margin-left:4px;padding:5px 6px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px">
      ~
      <input id="spc-date-to" type="date" style="padding:5px 6px;border:1px solid #cbd5e1;border-radius:7px;font-size:12px">
      <button class="btn btn-ghost btn-sm" id="spc-date-clear-btn" style="padding:4px 8px;font-size:11px" title="기간 필터 해제">전체</button>
    </label>
    <span id="spc-spec" style="font-size:12px;color:#64748b"></span>
    <span id="spc-spec-edit" style="display:none;font-size:12px;color:#374151;align-items:center;gap:4px">
      규격하한(LSL) <input id="spc-lsl-edit" type="number" step="0.001" style="width:70px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px">
      규격상한(USL) <input id="spc-usl-edit" type="number" step="0.001" style="width:70px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px">
      <span style="color:#7c3aed;margin-left:6px">관리하한(LCL)</span> <input id="spc-lcl-edit" type="number" step="0.001" placeholder="자동" style="width:70px;padding:4px 6px;border:1px solid #c4b5fd;border-radius:6px;font-size:12px">
      <span style="color:#7c3aed">관리상한(UCL)</span> <input id="spc-ucl-edit" type="number" step="0.001" placeholder="자동" style="width:70px;padding:4px 6px;border:1px solid #c4b5fd;border-radius:6px;font-size:12px">
      <span style="color:#94a3b8;font-size:11px" title="비워두면 X̄-R 관리도 공식(CL±A2·R̄)으로 자동 계산합니다.">ⓘ 비우면 자동계산</span>
      <button class="btn btn-primary btn-sm" id="spc-spec-save-btn" style="padding:4px 10px;font-size:11px">저장</button>
    </span>
  </div>

  <!-- 지표 타일 -->
  <div id="spc-tiles" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px"></div>

  <!-- 차트 -->
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px 18px">
    <div id="spc-chart-title" style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:8px"></div>
    <div style="width:100%;overflow-x:auto"><svg id="spc-svg" viewBox="0 0 940 360" style="width:100%;min-width:640px;height:auto;display:block"></svg></div>
    <div id="spc-foot" style="font-size:11px;color:#64748b;margin-top:8px"></div>
  </div>

  <!-- 공정능력도 -->
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px 18px;margin-top:14px">
    <div id="spc-cap-title" style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:8px"></div>
    <div style="width:100%;overflow-x:auto"><svg id="spc-cap" viewBox="0 0 940 260" style="width:100%;min-width:640px;height:auto;display:block"></svg></div>
  </div>

  <div id="spc-msg" style="margin-top:14px;font-size:13px"></div>
</div>

<script>
if (typeof initSpcTab === 'function') initSpcTab();
else console.error('js/spc.js 가 로드되지 않았습니다.');
</script>
